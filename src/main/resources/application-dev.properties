# 本地开发：结构变更先由 Hibernate 参与，再由 Flyway 固化为脚本（见 docs 第 10 章流程约定）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# devtools 每次热重启都会丢内存会话，这里固定「记住我」签名密钥，保证重启后勾选过记住我的浏览器仍保持登录
# 仅限本机演示；生产用 FLOWER_REMEMBER_SECRET 覆盖（application.properties 里默认留空=随机密钥）
app.remember-me.secret=dev-only-remember-me-secret-do-not-use-in-prod

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n
