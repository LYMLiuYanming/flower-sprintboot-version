# 受控环境：结构只由 Flyway 迁移脚本维护，Hibernate 仅做一致性校验
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.thymeleaf.cache=true
spring.web.resources.cache.period=86400

# 生产环境必须以环境变量提供数据库口令，缺失即启动失败（避免默认口令兜底）
spring.datasource.password=${FLOWER_DB_PASSWORD}

logging.level.root=WARN
logging.level.org.liuym.flowerv1springboot=INFO

management.endpoint.health.probes.enabled=true
