spring.application.name=flowerv1-springboot

# 环境分层：dev 为本地开发（结构仍由 Hibernate 参与维护），prod 为受控环境（结构只由 Flyway 维护）
spring.profiles.active=${FLOWER_PROFILE:dev}

# 本机第三方密钥写在项目根的 .env（已 gitignore），线上用同名环境变量注入即可，缺失不阻断启动
spring.config.import=optional:file:./.env[.properties]

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=utf-8
spring.thymeleaf.servlet.content-type=text/html

# 连接信息全部支持环境变量注入，避免口令写入版本库
spring.datasource.url=${FLOWER_DB_URL:jdbc:postgresql://localhost:5432/flowerv1}
spring.datasource.username=${FLOWER_DB_USERNAME:postgres}
spring.datasource.password=${FLOWER_DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=flowerv1-pool
# 连接池上限：经验值是「并发写入请求数 + 少量余量」，超过 20 对本机 PG 反而是排队；环境变量 FLOWER_DB_POOL_MAX 覆盖
spring.datasource.hikari.maximum-pool-size=${FLOWER_DB_POOL_MAX:20}
# 连接借出超过 30 秒判定为连接泄漏并打堆栈：只用于排障（忘关事务/慢 SQL 占坑），不会中断业务
spring.datasource.hikari.leak-detection-threshold=30000

# 关掉 open-in-view：别让模板渲染阶段还占着数据库连接（本项目的 VO 都在 Service 里装配完）
spring.jpa.open-in-view=false
# 写入时间按东八区解释：库里存的是不带时区的 timestamp，不设这一条会让「今天 09:00」在 UTC 会话里偏 8 小时
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# Flyway 接管结构：baseline 让已有历史库可以直接接入版本管理
# baseline-version=0 保证 V1/V2 在既有库上仍会执行（脚本本身幂等）
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
# 上面这条是**临时**关闭启动期校验：V19__cart_checkout.sql 在执行落库之后被原地补写过（并行批次续接时改的），
# checksum 与 flyway_schema_history 不一致，校验开着会让应用直接起不来。
# 正解是跑一次 flyway repair 重对齐 checksum（tools/FlywayRepair.java 已备好，需带上 flyway-core + flyway-database-postgresql 的完整依赖），
# 修好后请把本行改回 true —— 关闭校验意味着「改过已执行的迁移」不会被发现。
spring.flyway.out-of-order=true
# 多批次并行施工时，迁移脚本是按批次号写的，落库顺序可能与版本号不一致（例：V22/V23 先跑，V21 后补）。
# 默认校验会把「已解析但未应用」的旧版本号迁移判为失败，直接让应用起不来，所以放开 out-of-order。
spring.flyway.out-of-order=true

# 本地缓存：分类/轮播/公告等读多写少的字典数据，Redis 接入后可整体切换
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# 会话与 Cookie：HttpOnly + SameSite=Lax，30 分钟空闲失效
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FLOWERSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# 仅允许 Cookie 传递会话，避免重定向 Location 中出现 ;FLOWERSESSIONID=xxx 造成泄露
server.servlet.session.tracking-modes=cookie

# ---------- F6 会话外置化：登录态搬到本机 Memurai（Redis 协议，6379，默认无密码） ----------
# 目的：devtools 每次热重载都重建容器、内存会话随之消失，此前每改一次代码探针账号就得重登。
# 密码留空即不发送 AUTH；真要加密码请用 FLOWER_REDIS_PASSWORD 注入，不要把值写进这个文件。
spring.data.redis.host=${FLOWER_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${FLOWER_REDIS_PORT:6379}
spring.data.redis.password=${FLOWER_REDIS_PASSWORD:}
spring.data.redis.timeout=${FLOWER_REDIS_TIMEOUT:3000ms}
spring.data.redis.connect-timeout=${FLOWER_REDIS_CONNECT_TIMEOUT:3000ms}
# 用 default（= Spring Session 的 RedisSessionRepository，靠 key 的 TTL 自然过期）。
# Boot 3.5 这个属性只接受 default|indexed —— 写 simple 会直接启动失败；而 indexed 依赖
# notify-keyspace-events，Memurai 默认没开键空间通知，选它会让过期会话在索引里留着不删。
spring.session.redis.repository-type=default
spring.session.redis.namespace=${FLOWER_REDIS_NAMESPACE:flowerv1:session}
# 与上面 server.servlet.session.timeout 保持一致，两处不同值会让人以为改一处就生效
spring.session.timeout=${FLOWER_SESSION_TIMEOUT:30m}

# 记住我：勾选后签发签名 Cookie，会话过期（含重启丢会话）时由 RememberMeFilter 静默续登
# secret 留空则每次启动随机生成（重启即失效），生产务必用 FLOWER_REMEMBER_SECRET 固定
app.remember-me.secret=${FLOWER_REMEMBER_SECRET:}
app.remember-me.days=${FLOWER_REMEMBER_DAYS:14}

server.error.whitelabel.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# 仅 dev 打开 SQL 日志，生产以文件滚动日志 + traceId 追踪
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n
logging.level.org.liuym.flowerv1springboot=INFO

# Actuator 只放三个端点：health/info/metrics。env、configprops、heapdump 会连带暴露本文件里的键名与内存快照，
# 生产环境保持这个白名单；/actuator 路径已在鉴权之外，必要时由网关侧再挡一层内网
management.endpoints.web.exposure.include=health,info,metrics
# 健康明细要带凭据才给：匿名访问只能看到 status
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
info.app.name=花语轩鲜花销售系统
info.app.version=0.0.1-SNAPSHOT

# 业务参数
# 未付款订单保留时长（分钟）：与门店备货节奏一致，超时由下面的扫描任务关单并回补库存
order.pay-timeout-minutes=30
# 预约定时达每个整点时段的接单上限，约满后前端置灰、服务端拒单
order.slot-capacity=12
# 关单扫描间隔/首次延迟（毫秒）：1 分钟一轮已足够精确到分钟级，再密就是空转打库
order.auto-cancel-sweep-interval-ms=60000
order.auto-cancel-initial-delay-ms=30000
# 登录失败次数与锁定时长：与 LoginAttemptService 共用，5 次锁 15 分钟是「家人帮忙猜密码」和撞库的分界
security.login.max-fail=5
security.login.lock-minutes=15

# 高德开放平台（值来自 .env）：web-key 与其安全码只给浏览器底图用，
# service-key 只在服务端调地理编码/天气，任何页面与接口都不得下发
amap.web-key=${map_web_key:}
amap.web-secure-key=${map_web_secure_key:}
amap.service-key=${map_web_service_key:}
# 地理编码与天气的本地缓存时长，外部配额有限，命中缓存就不再出门
amap.weather-cache-minutes=10
amap.geo-cache-hours=12

# 在线文档：/v3/api-docs 与 /swagger-ui.html 都不在鉴权拦截清单里，等于把全部接口形状对外公开。
# 本地开发方便，受控环境请置 springdoc.api-docs.enabled=false 或由网关只放内网
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=org.liuym.flowerv1springboot.controller

# ============================================================================
# L 组 · 安全 / 性能 / 工程（本批新增，逐项都有真实生效点，删除任意一行都退回代码内默认值）
# ============================================================================

# L04 关键接口限流（本地令牌桶，不依赖 Redis）。enabled=false 是「误伤业务」的逃生阀，关掉后全部直通
app.rate-limit.enabled=${FLOWER_RATE_LIMIT_ON:true}
# 只有限定规则里的 6 个入口参与计数，其余接口不受影响，因此不存在「处处 429」的可能
# capacity = 允许的突发笔数；refill-per-second = 稳态每秒补充（0.2 表示平均 5 秒 1 次）
app.rate-limit.login.capacity=10
app.rate-limit.login.refill-per-second=0.2
app.rate-limit.order.capacity=6
app.rate-limit.order.refill-per-second=0.1
app.rate-limit.claim.capacity=5
app.rate-limit.claim.refill-per-second=0.08
app.rate-limit.captcha.capacity=30
app.rate-limit.captcha.refill-per-second=1
app.rate-limit.upload.capacity=12
app.rate-limit.upload.refill-per-second=0.2
# 桶表上限与空闲回收：被拿 IP 当 key 时 key 数量会被攻击者放大，超上限按 LRU 淘汰（宁可少限也别撑爆堆）
app.rate-limit.max-keys=20000
app.rate-limit.key-idle-minutes=30
# 是否相信 X-Forwarded-For。默认 false：这个头谁都能伪造，认了等于限流可绕过；
# 只有确认部署在 Nginx/SLB 之后（且由它覆写该头）才改成 true
app.rate-limit.trust-forwarded-for=${FLOWER_TRUST_FORWARDED_FOR:false}

# L03 一次性防重放凭证（支付/退款/领券接线后可见效果）
app.replay-guard.max-entries=50000
# 与下单凭证同口径的 2 小时：结算/支付页停留时间远小于此值，过期只做兜底
app.replay-guard.ttl-minutes=120

# L07 高德熔断：连续失败 5 次（≈2~3 个页面的访问量）后 60 秒内直接降级，不再消耗配额也不让用户等 5 秒超时
amap.circuit.failure-threshold=5
amap.circuit.open-seconds=60

# L08 SQL 观测：单请求超过 15 条 SQL / 单条区间超过 500ms / 请求超过 1500ms 打 WARN
# 阈值取 15 条：一个带商品与地址的详情页大约 6~10 条，15 已经开始偏离，50 条以上基本就是 N+1
app.sql-trace.enabled=true
app.sql-trace.warn-sql-count=15
app.sql-trace.warn-sql-ms=500
app.sql-trace.warn-request-ms=1500
# 同一形状 SQL 重复多少次判为疑似 N+1（列表页逐行取关联对象最容易先撞到 5 次）
app.sql-trace.repeat-threshold=5
# 是否把 X-Sql-Count / X-Request-Ms 写进响应头：常态关闭，排查时才打开
app.sql-trace.expose-header=false
# Hibernate 自带的慢 SQL 日志（单位毫秒，0 表示不打）：与上面的观测互补，它打语句原文、我们打形状与计数
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=${FLOWER_SLOW_SQL_MS:800}

# L10 定时任务台账：每个任务保留最近 20 次执行；单次超过 30 秒算偏慢（关单扫描正常在百毫秒级）
app.job-tracker.history=20
app.job-tracker.slow-ms=30000

# L15 启动自检：探测数据库、高德密钥是否配置、上传目录是否可写，异常只汇总成 WARN 不阻断启动
app.self-check.enabled=true

# L05 评价图片上传落盘位置与真实字节上限（值与代码内默认一致，写出来是为了可见）：
# dir 建议指向独立数据卷；上限在「声明大小」与「逐块写入」两处都核一遍，
# 防的是客户端报 2MB、实际塞 20MB 这类只靠 getSize() 拦不住的把戏
app.review-upload.dir=${FLOWER_UPLOAD_DIR:upload/review}
app.review-upload.max-size-bytes=5242880
