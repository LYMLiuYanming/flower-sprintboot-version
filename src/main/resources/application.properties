spring.application.name=flowerv1-springboot

# 环境分层：dev 为本地开发（结构仍由 Hibernate 参与维护），prod 为受控环境（结构只由 Flyway 维护）
spring.profiles.active=${FLOWER_PROFILE:dev}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=utf-8
spring.thymeleaf.servlet.content-type=text/html

# 连接信息全部支持环境变量注入，避免口令写入版本库
spring.datasource.url=${FLOWER_DB_URL:jdbc:postgresql://localhost:5432/flowerv1}
spring.datasource.username=${FLOWER_DB_USERNAME:postgres}
spring.datasource.password=${FLOWER_DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=flowerv1-pool
spring.datasource.hikari.maximum-pool-size=${FLOWER_DB_POOL_MAX:20}
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# Flyway 接管结构：baseline 让已有历史库可以直接接入版本管理
# baseline-version=0 保证 V1/V2 在既有库上仍会执行（脚本本身幂等）
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# 本地缓存：分类/轮播/公告等读多写少的字典数据，Redis 接入后可整体切换
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# 会话与 Cookie：HttpOnly + SameSite=Lax，30 分钟空闲失效
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FLOWERSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# 仅允许 Cookie 传递会话，避免重定向 Location 中出现 ;FLOWERSESSIONID=xxx 造成泄露
server.servlet.session.tracking-modes=cookie

# 记住我：勾选后签发签名 Cookie，会话过期（含重启丢会话）时由 RememberMeFilter 静默续登
# secret 留空则每次启动随机生成（重启即失效），生产务必用 FLOWER_REMEMBER_SECRET 固定
app.remember-me.secret=${FLOWER_REMEMBER_SECRET:}
app.remember-me.days=${FLOWER_REMEMBER_DAYS:14}

server.error.whitelabel.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# 仅 dev 打开 SQL 日志，生产以文件滚动日志 + traceId 追踪
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n
logging.level.org.liuym.flowerv1springboot=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
info.app.name=花语轩鲜花销售系统
info.app.version=0.0.1-SNAPSHOT

# 业务参数
order.pay-timeout-minutes=30
order.auto-cancel-sweep-interval-ms=60000
order.auto-cancel-initial-delay-ms=30000
security.login.max-fail=5
security.login.lock-minutes=15

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=org.liuym.flowerv1springboot.controller
