<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - 花语轩管理后台</title>
    <link th:href="@{/layui-v2.13.9/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/css/admin-theme.css}" rel="stylesheet">
    <link th:href="@{/css/f-g.css}" rel="stylesheet">
    <link th:href="@{/fontawesome/6.4.0/css/all.min.css}" rel="stylesheet">
    <style>
        body {background: #f1f1f1;}
        .audit-uri {font-family: Consolas, Monaco, monospace;font-size: 12px;color: #555;word-break: break-all;}
        .audit-method {display: inline-block;min-width: 46px;text-align:center;padding: 1px 6px;border-radius: 3px;font-size: 11px;margin-right: 6px;}
        .m-POST {background: #e6f7ff;color: #1890ff;}
        .m-PUT {background: #fff7e6;color: #fa8c16;}
        .m-PATCH {background: #f9f0ff;color: #722ed1;}
        .m-DELETE {background: #fff1f0;color: #f5222d;}
        .audit-ok {color: #52c41a;}
        .audit-bad {color: #f5222d;}
        .audit-detail {padding: 16px 18px;font-size: 13px;line-height: 1.7;}
        .audit-detail pre {background: #f7f7f7;border: 1px solid #eee;border-radius: 3px;padding: 10px;white-space: pre-wrap;word-break: break-all;max-height: 260px;overflow: auto;}
    </style>
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header header" style="background: #211f1a;">
            <div class="logo"><i class="fas fa-leaf"></i> 花语轩管理后台</div>
            <div class="user-info">
                <span><i class="fas fa-user-circle"></i> 管理员</span>
                <a href="/auth/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
            </div>
        </div>

        <div class="layui-side layui-bg-black" style="top: 60px;width: 200px;">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree" lay-filter="nav">
                    <li class="layui-nav-item">
                        <a href="/admin"><i class="fas fa-tachometer-alt"></i> 控制台</a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;"><i class="fas fa-th"></i> 商品管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/product-list"><i class="fas fa-box"></i> 商品列表</a></dd>
                            <dd><a href="/admin/category-list"><i class="fas fa-tags"></i> 分类管理</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;"><i class="fas fa-shopping-cart"></i> 订单管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/order-list"><i class="fas fa-list-alt"></i> 订单列表</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;"><i class="fas fa-users"></i> 用户管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/user-list"><i class="fas fa-user"></i> 用户列表</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;"><i class="fas fa-cog"></i> 系统设置</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/banner-list"><i class="fas fa-image"></i> 轮播图管理</a></dd>
                            <dd><a href="/admin/notice-list"><i class="fas fa-bullhorn"></i> 公告管理</a></dd>
                            <dd><a href="/admin/coupon-list"><i class="fas fa-ticket-alt"></i> 优惠券</a></dd>
                            <dd class="layui-this"><a href="/admin/audit-list"><i class="fas fa-history"></i> 操作日志</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
        </div>

        <div class="layui-body" style="left: 200px;">
            <div class="content-body" style="padding: 20px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="fas fa-history"></i> 操作日志
                    </div>
                    <div class="layui-card-body">
                        <!-- G25：操作人 / 模块 / 动作 / 结果 / 时间区间 / 关键词，六个条件任意组合，服务端分页 -->
                        <div class="layui-form fg-filtergrid" lay-filter="searchForm">
                            <div>
                                <label class="fg-lab">操作人</label>
                                <div class="layui-input-inline">
                                    <select name="operator" id="operatorSelect" lay-search>
                                        <option value="">全部操作人</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="fg-lab">业务模块</label>
                                <div class="layui-input-inline">
                                    <select name="module" id="moduleSelect" lay-filter="moduleSelect">
                                        <option value="">全部模块</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="fg-lab">动作</label>
                                <div class="layui-input-inline">
                                    <select name="action" id="actionSelect" lay-search>
                                        <option value="">全部动作</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="fg-lab">结果</label>
                                <div class="layui-input-inline">
                                    <select name="outcome">
                                        <option value="">成功与失败</option>
                                        <option value="ok">仅成功</option>
                                        <option value="bad">仅失败</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="fg-lab">时间范围</label>
                                <div class="layui-input-inline" style="display:flex;gap:6px">
                                    <input type="text" name="from" id="auditFrom" class="layui-input" placeholder="开始日期" readonly style="width:50%">
                                    <input type="text" name="to" id="auditTo" class="layui-input" placeholder="结束日期" readonly style="width:50%">
                                </div>
                            </div>
                            <div>
                                <label class="fg-lab">关键词</label>
                                <div class="layui-input-inline">
                                    <input type="text" name="keyword" placeholder="接口 / 结果说明 / 请求摘要" class="layui-input">
                                </div>
                            </div>
                            <div>
                                <label class="fg-lab">&nbsp;</label>
                                <div class="layui-input-inline" style="white-space:nowrap">
                                    <button type="button" class="layui-btn" lay-submit lay-filter="search">
                                        <i class="fas fa-search"></i> 查询
                                    </button>
                                    <button type="button" class="layui-btn layui-btn-primary" id="btnReset">
                                        <i class="fas fa-undo"></i> 重置
                                    </button>
                                    <button type="button" class="layui-btn layui-btn-primary" id="btnExport">
                                        <i class="fas fa-file-csv"></i> 导出 CSV
                                    </button>
                                </div>
                            </div>
                        </div>
                        <p style="font-size:11.5px;color:#8f8b80;margin:10px 0 14px">
                            请求摘要在入库与展示两侧都做了脱敏：口令类字段固定为 <code>******</code>，手机号中间四位打码。
                        </p>

                        <table class="layui-hide" id="auditTable" lay-filter="auditTable"></table>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-footer">© 2024 花语轩鲜花销售系统 - 版权所有</div>
    </div>

    <script type="text/html" id="operateTpl">
        <a class="layui-btn layui-btn-xs" lay-event="detail"><i class="fas fa-eye"></i> 详情</a>
    </script>

    <script type="text/html" id="toolbarCols">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="cols">
                <i class="fas fa-columns"></i> 列设置
            </button>
        </div>
    </script>

    <script th:src="@{/layui-v2.13.9/layui/layui.js}"></script>
    <script th:src="@{/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/site.js}"></script>
    <script th:src="@{/js/admin-common.js}"></script>
    <script th:src="@{/js/hu-admin-ui.js}"></script>
    <script th:inline="none">
        layui.use(['table', 'form', 'layer', 'laydate'], function () {
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var laydate = layui.laydate;
            var esc = huAdmin.esc;
            var FILTER_KEY = 'hu-admin-filter-audit';
            var COLS_KEY = 'audit-list';
            var TABLE = 'auditTable';
            var URL = '/api/admin/audit-logs';
            var state = huAdmin.listState('audit');
            var KEYS = ['operator', 'module', 'action', 'keyword', 'outcome', 'from', 'to'];

            ['auditFrom', 'auditTo'].forEach(function (id) {
                laydate.render({elem: '#' + id, type: 'date', trigger: 'click'});
            });

            function fmt(v) {
                return v ? new Date(v).toLocaleString() : '-';
            }

            function currentFilter() {
                try { return JSON.parse(sessionStorage.getItem(FILTER_KEY) || '{}'); } catch (e) { return {}; }
            }

            function buildWhere(f) {
                var where = {};
                KEYS.forEach(function (key) { if (f[key]) where[key] = $.trim(f[key]); });
                return where;
            }

            var COLS = [
                {field: 'createdAt', title: '时间', width: 162, templet: function (d) {
                    return fmt(d.createdAt);
                }},
                {field: 'operatorName', title: '操作人', width: 100, templet: function (d) { return esc(d.operatorName || '-'); }},
                {field: 'module', title: '模块', width: 96, templet: function (d) { return esc(d.module); }},
                {field: 'action', title: '动作', width: 96, templet: function (d) { return esc(d.action); }},
                {field: 'uri', title: '目标接口', minWidth: 244, templet: function (d) {
                    return '<span class="audit-uri"><i class="audit-method m-' + esc(d.method) + '">'
                        + esc(d.method) + '</i>' + esc(d.uri) + '</span>';
                }},
                {field: 'resultCode', title: '结果', width: 116, templet: function (d) {
                    var ok = d.resultCode === 200 || d.resultCode == null;
                    var head = ok ? '<span class="audit-ok">成功</span>'
                        : '<span class="audit-bad">' + esc(d.resultCode) + '</span>';
                    return head + (d.resultMsg ? '<br><small style="color:#999">' + esc(d.resultMsg) + '</small>' : '');
                }},
                {field: 'ip', title: '来源 IP', width: 128, templet: function (d) { return esc(d.ip || '-'); }},
                {field: 'detail', title: '请求摘要（脱敏）', minWidth: 190, templet: function (d) {
                    if (!d.detail) return '<span class="fg-auditempty">无请求体</span>';
                    var text = d.detail.length > 46 ? d.detail.substring(0, 46) + '…' : d.detail;
                    return '<span style="font-size:12px;color:#888">' + esc(text) + '</span>';
                }},
                {field: 'op', title: '操作', width: 76, toolbar: '#operateTpl', fixed: 'right'}
            ];
            huAdminUI.applyHidden(COLS, COLS_KEY);

            var hooks = huAdminUI.tableHooks(TABLE, {
                url: URL, state: state,
                hasFilter: function () { return Object.keys(buildWhere(currentFilter())).length > 0; }
            });

            table.render({
                elem: '#' + TABLE,
                url: URL,
                cols: [COLS],
                toolbar: '#toolbarCols',
                defaultToolbar: [],
                /* 排序由查询侧固定为时间倒序，表头不做二次排序，免得和留痕的真实顺序对不上 */
                autoSort: false,
                limit: state.limit(20),
                limits: [20, 30, 50, 100],
                page: huAdminUI.pageConfig(state, {limits: [20, 30, 50, 100]}),
                done: hooks.done,
                error: hooks.error
            });

            (function restore() {
                var f = currentFilter();
                if (!Object.keys(buildWhere(f)).length) return;
                form.val('searchForm', f);
                table.reload(TABLE, {where: buildWhere(f), page: {curr: state.pageConfig().curr || 1}});
            })();

            form.on('submit(search)', function (data) {
                sessionStorage.setItem(FILTER_KEY, JSON.stringify(data.field));
                state.reset();
                table.reload(TABLE, {where: buildWhere(data.field), page: {curr: 1}});
                return false;
            });

            $('#btnReset').on('click', function () {
                sessionStorage.removeItem(FILTER_KEY);
                state.reset();
                var empty = {};
                KEYS.forEach(function (key) { empty[key] = ''; });
                form.val('searchForm', empty);
                table.reload(TABLE, {where: {}, page: {curr: 1}});
            });

            /* G26：导出沿用当前筛选条件，导出的就是屏幕上这一批 */
            $('#btnExport').on('click', function () {
                var where = buildWhere(currentFilter());
                var pairs = Object.keys(where).map(function (k) {
                    return encodeURIComponent(k) + '=' + encodeURIComponent(where[k]);
                });
                window.location.href = URL + '/export' + (pairs.length ? '?' + pairs.join('&') : '');
            });

            /* 筛选框数据源：操作人与模块计数由服务端给，模块条数标在选项上 */
            huAdmin.request({url: URL + '/facets', silent: true, ok: function (res) {
                var d = res.data || {};
                var operators = '<option value="">全部操作人</option>' + (d.operators || []).map(function (name) {
                    return '<option value="' + esc(name) + '">' + esc(name) + '</option>';
                }).join('');
                var modules = '<option value="">全部模块</option>' + Object.keys(d.modules || {}).map(function (name) {
                    return '<option value="' + esc(name) + '">' + esc(name) + '（' + d.modules[name] + '）</option>';
                }).join('');
                $('#operatorSelect').html(operators);
                $('#moduleSelect').html(modules);
                form.render('select');
                loadActions(currentFilter().module || '');
            }});

            function loadActions(module) {
                huAdmin.request({url: URL + '/facets', data: {module: module || ''}, silent: true, ok: function (res) {
                    var list = (res.data && res.data.actions) || [];
                    $('#actionSelect').html('<option value="">全部动作</option>' + list.map(function (name) {
                        return '<option value="' + esc(name) + '">' + esc(name) + '</option>';
                    }).join(''));
                    var keep = currentFilter().action;
                    if (keep) $('#actionSelect').val(keep);
                    form.render('select');
                }});
            }

            /* 动作候选跟模块走：选「商品」只看商品相关的动作，下拉不会被全站动作撑长 */
            form.on('select(moduleSelect)', function (data) {
                loadActions(data.value);
            });

            table.on('toolbar(' + TABLE + ')', function (obj) {
                if (obj.event === 'cols') huAdminUI.openColumnPicker(TABLE, COLS, COLS_KEY);
            });

            /* G26 详情展开：整包请求摘要也走服务端脱敏后的投影，不把原文留在浏览器里 */
            table.on('tool(' + TABLE + ')', function (obj) {
                if (obj.event !== 'detail') return;
                huAdmin.request({
                    url: URL + '/' + obj.data.id, silent: true,
                    ok: function (res) { showDetail(res.data || obj.data); },
                    fail: function () { showDetail(obj.data); }
                });
            });

            function showDetail(d) {
                layer.open({
                    type: 1,
                    title: '操作详情 · ' + esc(d.module) + ' ' + esc(d.action),
                    area: ['660px', '540px'],
                    content: '<div class="audit-detail">'
                        + kv('操作人', esc((d.operatorName || '-') + (d.operatorId ? ' #' + String(d.operatorId).slice(0, 8) : '')))
                        + kv('时间', fmt(d.createdAt))
                        + kv('来源 IP', esc(d.ip || '-'))
                        + kv('接口', '<span class="audit-method m-' + esc(d.method) + '">' + esc(d.method)
                            + '</span>' + esc(d.uri))
                        + kv('结果', (d.resultCode == null ? '-' : d.resultCode)
                            + (d.resultMsg ? ' · ' + esc(d.resultMsg) : ''))
                        + kv('请求摘要', '<pre>' + esc(pretty(d.detail)) + '</pre>')
                        + '<span class="fg-masktag"><i class="fas fa-user-shield"></i> 口令与手机号已脱敏</span>'
                        + '</div>'
                });
            }

            function kv(label, value) {
                return '<div class="fg-kv"><b>' + label + '</b>' + value + '</div>';
            }

            /** 详情存的是脱敏后的 JSON 串，展示前尽量格式化；被截断的半截 JSON 按原文输出 */
            function pretty(detail) {
                if (!detail) return '（无请求体）';
                try { return JSON.stringify(JSON.parse(detail), null, 2); } catch (e) { return detail; }
            }
        });
    </script>
</body>
</html>
