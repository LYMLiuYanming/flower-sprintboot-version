<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优惠券管理 - 花语轩管理后台</title>
    <link th:href="@{/layui-v2.13.9/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/css/admin-theme.css}" rel="stylesheet">
    <link th:href="@{/fontawesome/6.4.0/css/all.min.css}" rel="stylesheet">
    <style>
        body {background: #f1f1f1;}
        .cp-status {padding: 3px 8px;border-radius: 3px;font-size: 12px;}
        .cp-active {background: #f6ffed;color: #52c41a;}
        .cp-inactive {background: #f5f5f5;color: #8c8c8c;}
        .cp-rule {color: #1c4b8a;font-weight: 600;}
        .cp-window {color: #595959;font-size: 12px;line-height: 1.6;}
        .cp-stock-full {color: #f5222d;}
        .cp-form-tip {color: #999;font-size: 12px;margin-top: 4px;line-height: 1.5;}
        .cp-scope {color: #333;font-size: 12px;}
        .cp-flag {display:inline-block;padding:2px 6px;border-radius:3px;background:#f0f5ff;color:#1c4b8a;font-size:11px;margin-right:4px;}
        .cp-stat {font-variant-numeric: tabular-nums;}
        .cp-stat-bar {display:flex;gap:26px;flex-wrap:wrap;padding:14px 4px 2px;font-size:13px;color:#595959;}
        .cp-stat-bar b {color:#1c4b8a;font-size:17px;margin-left:6px;font-variant-numeric:tabular-nums;}
        .cp-group {border-top:1px dashed #e6e6e6;padding-top:14px;margin-top:14px;}
        .cp-group__title {font-size:12px;color:#8c8c8c;letter-spacing:1px;margin:0 0 10px 110px;}
        .cp-checks {display:flex;gap:22px;flex-wrap:wrap;padding-top:4px;}
        .layui-form-item {margin-bottom: 14px;}
    </style>
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header header" style="background: #211f1a;">
            <div class="logo"><i class="fas fa-leaf"></i> 花语轩管理后台</div>
            <div class="user-info">
                <span><i class="fas fa-user-circle"></i> 管理员</span>
                <a href="/auth/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
            </div>
        </div>

        <div class="layui-side layui-bg-black" style="top: 60px;width: 200px;">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree" lay-filter="nav">
                    <li class="layui-nav-item">
                        <a href="/admin"><i class="fas fa-tachometer-alt"></i> 控制台</a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;"><i class="fas fa-th"></i> 商品管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/product-list"><i class="fas fa-box"></i> 商品列表</a></dd>
                            <dd><a href="/admin/category-list"><i class="fas fa-tags"></i> 分类管理</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;"><i class="fas fa-shopping-cart"></i> 订单管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/order-list"><i class="fas fa-list-alt"></i> 订单列表</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;"><i class="fas fa-users"></i> 用户管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/user-list"><i class="fas fa-user"></i> 用户列表</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;"><i class="fas fa-cog"></i> 系统设置</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/banner-list"><i class="fas fa-image"></i> 轮播图管理</a></dd>
                            <dd><a href="/admin/notice-list"><i class="fas fa-bullhorn"></i> 公告管理</a></dd>
                            <dd class="layui-this"><a href="/admin/coupon-list"><i class="fas fa-ticket-alt"></i> 优惠券</a></dd>
                            <dd><a href="/admin/promotion-list"><i class="fas fa-bullseye"></i> 促销位与满减</a></dd>
                            <dd><a href="/admin/audit-list"><i class="fas fa-history"></i> 操作日志</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
        </div>

        <div class="layui-body" style="left: 200px;">
            <div class="content-body" style="padding: 20px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="fas fa-ticket-alt"></i> 优惠券
                        <span style="color:#8c8c8c;font-size:12px;margin-left:10px;">券面条款在用户领取时快照，改模板不影响已发出的券</span>
                        <button class="layui-btn layui-btn-xs layui-btn-normal" style="float: right;" onclick="huCouponAdd()">
                            <i class="fas fa-plus"></i> 新建优惠券
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <div class="cp-stat-bar" id="statBar"></div>
                        <table class="layui-hide" id="couponTable" lay-filter="couponTable"></table>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-footer">© 2024 花语轩鲜花销售系统 - 版权所有</div>
    </div>

    <script type="text/html" id="operateTpl">
        <a class="layui-btn layui-btn-xs" lay-event="edit"><i class="fas fa-edit"></i> 编辑</a>
        <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="copy" title="复制新建，副本默认停用"><i class="fas fa-clone"></i> 复制</a>
        {{# if(d.status === 'active') { }}
        <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="disable"><i class="fas fa-ban"></i> 下架</a>
        {{# } else { }}
        <a class="layui-btn layui-btn-xs" lay-event="enable"><i class="fas fa-check"></i> 上架</a>
        {{# } }}
        <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="issue" title="定向发放给用户"><i class="fas fa-paper-plane"></i></a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="fas fa-trash"></i> 删除</a>
    </script>

    <script th:src="@{/layui-v2.13.9/layui/layui.js}"></script>
    <script th:src="@{/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/admin-common.js}"></script>
    <script th:inline="none">
        layui.use(['table', 'layer', 'form', 'laydate'], function () {
            var table = layui.table;
            var layer = layui.layer;
            var laydate = layui.laydate;
            var esc = huAdmin.esc;
            var categories = [];
            var products = [];
            var sceneText = {claim: '领券中心', admin: '仅后台直发', after_pay: '下单返券', invite: '邀请奖励'};

            function fmt(v) {
                return v ? String(v).replace('T', ' ').slice(0, 16) : '';
            }

            /* 表格行内只保留月-日，完整时间放在 title 悬浮提示里，避免窄列被省略号截断 */
            function md(v) {
                var s = fmt(v);
                return s ? s.slice(5, 10) : '';
            }

            function num(v) {
                return Number(v || 0);
            }

            /** E05/E07/E18/E04/E01 的特征标记，全部读服务端字段，后台不再自己解释条款 */
            function flags(d) {
                var list = [];
                if (d.newUserOnly) list.push('新客专享');
                if (d.memberOnly) list.push('会员专享');
                if (d.allowTransfer) list.push('可转赠');
                if (num(d.perUserDailyLimit) > 0) list.push('每日 ' + d.perUserDailyLimit + ' 张');
                if (d.ladderRule) list.push('阶梯');
                if (d.productIds && d.productIds.length) list.push('白名单 ' + d.productIds.length + ' 款');
                if (d.triggerScene && d.triggerScene !== 'claim') list.push(sceneText[d.triggerScene] || d.triggerScene);
                return list.length ? '<div>' + list.map(function (t) {
                    return '<span class="cp-flag">' + esc(t) + '</span>';
                }).join('') + '</div>' : '<span style="color:#bfbfbf">—</span>';
            }

            function renderTable() {
                table.render({
                    elem: '#couponTable',
                    url: '/api/admin/coupons',
                    /* 券模板数量有限：一次拉全量，避免后台忽略分页参数造成空页 */
                    page: false,
                    where: {limit: 100},
                    cols: [[
                        {field: 'code', title: '券码', width: 110},
                        {field: 'name', title: '名称', minWidth: 150},
                        {field: 'ruleText', title: '券面规则', minWidth: 170, templet: function (d) {
                            return '<span class="cp-rule">' + esc(d.ruleText || '-') + '</span>' +
                                (d.ladderText ? '<div style="color:#8c8c8c;font-size:11px;">' + esc(d.ladderText) + '</div>' : '');
                        }},
                        {field: 'scopeText', title: '适用范围（自动生成）', minWidth: 150, templet: function (d) {
                            return '<span class="cp-scope">' + esc(d.scopeText || '-') + '</span>';
                        }},
                        {field: 'issued', title: '发行/已领/限领', width: 100, templet: function (d) {
                            var left = num(d.total) > 0 ? (num(d.total) - num(d.issued)) : null;
                            var text = num(d.issued) + ' / ' + (num(d.total) > 0 ? d.total : '∞') + ' / ' + (num(d.perUserLimit) || 1);
                            return left != null && left <= 0
                                ? '<span class="cp-stock-full" title="本批已领完">' + text + '</span>' : text;
                        }},
                        {field: 'claimedCount', title: '领取/核销/核销率', width: 126, templet: function (d) {
                            var rate = d.useRate == null ? 0 : num(d.useRate);
                            return '<span class="cp-stat">' + num(d.claimedCount) + ' / ' + num(d.usedCount) +
                                ' / ' + rate.toFixed(1) + '%</span>';
                        }},
                        {field: 'features', title: '玩法', minWidth: 168, templet: flags},
                        {field: 'startTime', title: '领取窗口 / 有效期', width: 172, templet: function (d) {
                            var recv = (!d.startTime && !d.endTime) ? '长期可领'
                                : (md(d.startTime) || '立即') + '~' + (md(d.endTime) || '不限');
                            var valid = num(d.validDays) > 0 ? '领后' + d.validDays + '天'
                                : (d.validEndTime ? '至' + md(d.validEndTime) : '随活动结束');
                            var full = '领取 ' + (fmt(d.startTime) || '立即') + ' ~ ' + (fmt(d.endTime) || '不限') +
                                '\n有效 ' + (num(d.validDays) > 0 ? '领取后 ' + d.validDays + ' 天内' : (fmt(d.validEndTime) || '随活动结束')) +
                                '\n停用策略：' + (d.disablePolicy === 'void' ? '作废未领券' : '保留已领券');
                            return '<span class="cp-window" title="' + esc(full) + '">' + esc(recv) + ' · ' + esc(valid) + '</span>';
                        }},
                        {field: 'status', title: '状态', width: 66, templet: function (d) {
                            return '<span class="cp-status cp-' + esc(d.status) + '">' + (d.status === 'active' ? '上架' : '下架') + '</span>';
                        }},
                        {title: '操作', width: 268, toolbar: '#operateTpl', fixed: 'right'}
                    ]]
                });
            }

            function reload() {
                table.reload('couponTable');
                loadStats();
            }

            /** E13：顶部汇总条，模板数量与领取/核销总量一次取回 */
            function loadStats() {
                jQuery.getJSON('/api/admin/coupons/stats', function (res) {
                    if (!res || res.code !== 200 || !res.data) return;
                    var sum = {claimed: 0, used: 0, amount: 0};
                    res.data.forEach(function (s) {
                        sum.claimed += num(s.claimedCount);
                        sum.used += num(s.usedCount);
                        sum.amount += num(s.usedAmount);
                    });
                    var rate = sum.claimed > 0 ? (sum.used * 100 / sum.claimed).toFixed(1) : '0.0';
                    jQuery('#statBar').html(
                        '模板数<b>' + res.data.length + '</b>' +
                        '累计领取<b>' + sum.claimed + '</b>' +
                        '累计核销<b>' + sum.used + '</b>' +
                        '整体核销率<b>' + rate + '%</b>' +
                        '已核销金额<b>¥' + sum.amount.toFixed(2) + '</b>');
                });
            }

            /**
             * E12：下架时必须当场决定已领券的去留。
             * keep 保留可用，void 立即作废未使用的券（已核销的历史凭证不动）
             */
            function toggleStatus(row) {
                layer.confirm('下架后用户无法继续领取。<br>已领未用的券怎么处理？', {
                    title: '下架「' + esc(row.name) + '」',
                    btn: ['保留可用', '立即作废', '取消'],
                    btn3: function (index) { layer.close(index); },
                    yes: function (index) { sendStatus(row, 'inactive', 'keep', index); },
                    btn2: function (index) { sendStatus(row, 'inactive', 'void', index); }
                });
            }

            function sendStatus(row, status, policy, index) {
                huAdmin.request({
                    url: '/api/admin/coupons/' + row.id + '/status?status=' + status + (policy ? '&policy=' + policy : ''),
                    type: 'POST',
                    ok: function () {
                        /* 上架路径没有弹窗，index 为空时直接刷新 */
                        if (index != null) layer.close(index);
                        reload();
                    },
                    fail: function () { /* 保留弹窗，管理员可换一种策略再点一次 */ }
                });
            }

            table.on('tool(couponTable)', function (obj) {
                if (obj.event === 'edit') {
                    openForm(obj.data);
                } else if (obj.event === 'copy') {
                    layer.confirm('复制会新建一张同条款的副本（券码自动加 -C2，副本默认停用），确定？', function (index) {
                        huAdmin.request({
                            url: '/api/admin/coupons/' + obj.data.id + '/copy',
                            type: 'POST',
                            ok: function () { layer.close(index); reload(); }
                        });
                    });
                } else if (obj.event === 'disable') {
                    toggleStatus(obj.data);
                } else if (obj.event === 'enable') {
                    sendStatus(obj.data, 'active', null, null);
                } else if (obj.event === 'issue') {
                    openIssue(obj.data);
                } else if (obj.event === 'del') {
                    huAdmin.confirmDelete('确定要删除「' + obj.data.name + '」吗？已发放的券不受影响。',
                        '/api/admin/coupons/' + obj.data.id, reload);
                }
            });

            function field(label, control, tip) {
                return '<div class="layui-form-item"><label class="layui-form-label">' + label + '</label>' +
                    '<div class="layui-input-block">' + control +
                    (tip ? '<div class="cp-form-tip">' + tip + '</div>' : '') + '</div></div>';
            }

            function multiField(label, id, options, selected, tip) {
                var hit = (selected || []).map(function (v) { return String(v); });
                return field(label, '<select id="' + id + '" multiple lay-search lay-filter="' + id + '">' +
                    options.map(function (o) {
                        return '<option value="' + esc(o.id) + '"' + (hit.indexOf(String(o.id)) >= 0 ? ' selected' : '') + '>' + esc(o.name) + '</option>';
                    }).join('') + '</select>', tip);
            }

            function checks(items) {
                return '<div class="layui-form-item"><div class="layui-input-block cp-checks">' + items.map(function (c) {
                    return '<input type="checkbox" id="' + c.id + '" lay-skin="primary" lay-text="' + esc(c.text) + '"' +
                        (c.on ? ' checked' : '') + ' title="' + esc(c.text) + '">';
                }).join('') + '</div></div>';
            }

            /**
             * 新增/编辑共用表单：coupon 为 null 表示新建。
             * 满减 / 折扣、全场 / 分类 两组字段互斥，切换时直接隐藏不相关输入，避免误填
             */
            function openForm(coupon) {
                var isEdit = !!coupon;
                var v = coupon || {code: '', name: '', type: 'cash', threshold: '', amount: '',
                    discountRate: '', maxDiscount: '', total: 100, perUserLimit: 1, perUserDailyLimit: 0,
                    scope: 'all', status: 'active', validDays: 30, disablePolicy: 'keep',
                    triggerScene: 'claim', grantMinAmount: 0, categoryIds: [], productIds: []};
                var catOptions = categories.map(function (c) {
                    return {id: c.id, name: c.name};
                });
                var productOptions = products.map(function (p) {
                    return {id: p.id, name: (p.code ? p.code + ' · ' : '') + p.name};
                });

                layer.open({
                    type: 1,
                    title: isEdit ? '编辑优惠券 · ' + esc(v.code) : '新建优惠券',
                    area: ['720px', '84%'],
                    content: '<form class="layui-form" style="padding:20px 24px 0">' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1">' + field('券码', '<input type="text" id="cfCode" value="' + esc(v.code) + '" class="layui-input" placeholder="如 FLOWER30">', '3-30 位字母数字，自动转大写') + '</div>' +
                        '<div style="flex:1.4">' + field('名称', '<input type="text" id="cfName" value="' + esc(v.name) + '" class="layui-input" placeholder="如 新客满199减30">') + '</div>' +
                        '</div>' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1">' + field('类型', '<select id="cfType" lay-filter="cfType">' +
                            '<option value="cash"' + (v.type === 'cash' ? ' selected' : '') + '>满减券</option>' +
                            '<option value="discount"' + (v.type === 'discount' ? ' selected' : '') + '>折扣券</option></select>') + '</div>' +
                        '<div style="flex:1">' + field('使用门槛', '<input type="number" id="cfThreshold" value="' + esc(v.threshold == null ? '' : v.threshold) + '" class="layui-input" placeholder="0 表示无门槛">', '按适用范围内的商品小计算') + '</div>' +
                        '</div>' +
                        '<div class="cash-only">' + field('满减金额', '<input type="number" id="cfAmount" value="' + esc(v.amount == null ? '' : v.amount) + '" class="layui-input" placeholder="如 30">') + '</div>' +
                        '<div class="discount-only">' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1">' + field('折扣率', '<input type="number" step="0.01" id="cfRate" value="' + esc(v.discountRate == null ? '' : v.discountRate) + '" class="layui-input" placeholder="0.88 表示 8.8 折">') + '</div>' +
                        '<div style="flex:1">' + field('最高抵扣', '<input type="number" id="cfMaxDiscount" value="' + esc(v.maxDiscount == null ? '' : v.maxDiscount) + '" class="layui-input" placeholder="留空不封顶">') + '</div>' +
                        '</div></div>' +
                        /* E01：阶梯条款优先于单档，页面不再手抄券面文案 */
                        field('满减阶梯', '<input type="text" id="cfLadder" value="' + esc(v.ladderRule || '') + '" class="layui-input" placeholder="199:20,399:60,599:100">',
                            '门槛:减免，逗号分隔；填写后本券自动取够得着的最高档，券面文案由系统生成') +
                        '<div class="cp-group"><p class="cp-group__title">发放与限制</p>' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1">' + field('发行量', '<input type="number" id="cfTotal" value="' + esc(v.total == null ? 0 : v.total) + '" class="layui-input">', '0 表示不限量') + '</div>' +
                        '<div style="flex:1">' + field('每人限领', '<input type="number" id="cfPerUser" value="' + esc(v.perUserLimit == null ? 1 : v.perUserLimit) + '" class="layui-input">') + '</div>' +
                        /* E04：每日限领张数，配合 user_coupon 的条件唯一索引挡住同日重复领取 */
                        '<div style="flex:1">' + field('每日限领', '<input type="number" id="cfDaily" value="' + esc(v.perUserDailyLimit == null ? 0 : v.perUserDailyLimit) + '" class="layui-input">', '0 表示不按天限制') + '</div>' +
                        '</div>' +
                        checks([
                            {id: 'cfNew', text: '新客专享', on: v.newUserOnly},
                            {id: 'cfMember', text: '会员专享', on: v.memberOnly},
                            {id: 'cfTransfer', text: '允许转赠', on: v.allowTransfer}
                        ])</div> +
                        '<div class="cp-group"><p class="cp-group__title">发放场景</p>' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1.4">' + field('场景', '<select id="cfScene" lay-filter="cfScene">' +
                            ['claim', 'admin', 'after_pay', 'invite'].map(function (s) {
                                return '<option value="' + s + '"' + (v.triggerScene === s ? ' selected' : '') + '>' + sceneText[s] + '</option>';
                            }).join('') + '</select>', '只有「领券中心」会出现在前台领券页') + '</div>' +
                        '<div style="flex:1" class="scene-grant' + (v.triggerScene === 'after_pay' ? '' : ' layui-hide') + '">' +
                        field('返券门槛', '<input type="number" id="cfGrantMin" value="' + esc(v.grantMinAmount == null ? '' : v.grantMinAmount) + '" class="layui-input">', '实付满此数才发（E15）') + '</div>' +
                        '</div></div>' +
                        '<div class="cp-group"><p class="cp-group__title">时间与有效期</p>' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1">' + field('可领开始', '<input type="text" id="cfStart" value="' + fmt(v.startTime) + '" class="layui-input" placeholder="留空立即开始" readonly>') + '</div>' +
                        '<div style="flex:1">' + field('可领截止', '<input type="text" id="cfEnd" value="' + fmt(v.endTime) + '" class="layui-input" placeholder="留空不限" readonly>') + '</div>' +
                        '</div>' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1">' + field('有效天数', '<input type="number" id="cfValidDays" value="' + esc(v.validDays == null ? '' : v.validDays) + '" class="layui-input" placeholder="如 30">', '与右侧固定到期二选一') + '</div>' +
                        '<div style="flex:1">' + field('固定到期', '<input type="text" id="cfValidEnd" value="' + fmt(v.validEndTime) + '" class="layui-input" placeholder="留空按天数" readonly>') + '</div>' +
                        '</div></div>' +
                        '<div class="cp-group"><p class="cp-group__title">适用范围（E20 文案自动生成）</p>' +
                        field('适用范围', '<select id="cfScope" lay-filter="cfScope">' +
                            '<option value="all"' + (v.scope !== 'category' ? ' selected' : '') + '>全场通用</option>' +
                            '<option value="category"' + (v.scope === 'category' ? ' selected' : '') + '>指定分类</option></select>') +
                        '<div class="category-wrap' + (v.scope === 'category' ? '' : ' layui-hide') + '">' +
                        multiField('分类（可多选）', 'cfCategories', catOptions, v.categoryIds, '多选时任一分类命中即可，自动含其下级分类') + '</div>' +
                        multiField('商品白名单', 'cfProducts', productOptions, v.productIds, '留空表示不限；填写后只有名单内的花礼参与算价') +
                        (isEdit ? '<div class="cp-form-tip" style="margin-left:110px">当前生成文案：' + esc(v.scopeText || '—') + '</div>' : '') +
                        '</div>' +
                        '<div class="cp-group"><p class="cp-group__title">状态与停用策略</p>' +
                        '<div style="display:flex;gap:12px">' +
                        '<div style="flex:1">' + field('状态', '<select id="cfStatus">' +
                            '<option value="active"' + (v.status !== 'inactive' ? ' selected' : '') + '>上架</option>' +
                            '<option value="inactive"' + (v.status === 'inactive' ? ' selected' : '') + '>下架</option></select>') + '</div>' +
                        /* E12：默认策略决定列表里「下架」的默认动作，页面上仍可临时切换 */ +
                        '<div style="flex:1">' + field('停用策略', '<select id="cfDisable">' +
                            '<option value="keep"' + (v.disablePolicy !== 'void' ? ' selected' : '') + '>保留已领券</option>' +
                            '<option value="void"' + (v.disablePolicy === 'void' ? ' selected' : '') + '>作废未领券</option></select>') + '</div>' +
                        '</div></div>' +
                        '<div class="layui-form-item"><div class="layui-input-block">' +
                        '<button type="button" class="layui-btn" id="cfSubmit">保存</button></div></div>' +
                        '</form>',
                    success: function () {
                        layui.form.render(null, null);
                        laydate.render({elem: '#cfStart', type: 'datetime', trigger: 'click'});
                        laydate.render({elem: '#cfEnd', type: 'datetime', trigger: 'click'});
                        laydate.render({elem: '#cfValidEnd', type: 'datetime', trigger: 'click'});
                        syncFields();
                        jQuery('#cfSubmit').on('click', function () {
                            var payload = buildPayload();
                            if (!payload) return;
                            huAdmin.request({
                                url: isEdit ? '/api/admin/coupons/' + coupon.id : '/api/admin/coupons',
                                type: isEdit ? 'PUT' : 'POST',
                                data: payload,
                                ok: function () {
                                    layer.closeAll('page');
                                    reload();
                                }
                            });
                        });
                    }
                });
            }

            function syncFields() {
                var cash = jQuery('#cfType').val() !== 'discount';
                jQuery('.cash-only').toggleClass('layui-hide', !cash);
                jQuery('.discount-only').toggleClass('layui-hide', cash);
                var byCategory = jQuery('#cfScope').val() === 'category';
                jQuery('.category-wrap').toggleClass('layui-hide', !byCategory);
                jQuery('.scene-grant').toggleClass('layui-hide', jQuery('#cfScene').val() !== 'after_pay');
            }

            /* 类型 / 范围切换：layui 改写原生 select 时不派发 change，两种事件都挂上 */
            layui.form.on('select(cfType)', syncFields);
            layui.form.on('select(cfScope)', syncFields);
            layui.form.on('select(cfScene)', syncFields);
            jQuery(document).on('change', '#cfType, #cfScope, #cfScene', syncFields);

            function val(id) {
                return jQuery.trim(jQuery(id).val());
            }

            function dec(id) {
                var text = val(id);
                return text === '' ? null : Number(text);
            }

            function iso(id) {
                var text = val(id);
                return text ? text.replace(' ', 'T') : null;
            }

            function picked(id) {
                return (jQuery(id).val() || []).map(function (v) { return v; });
            }

            /** 前端只做必填与时间先后拦截，条款合法性以后端 validate 为准 */
            function buildPayload() {
                var type = val('#cfType');
                var code = val('#cfCode');
                var name = val('#cfName');
                if (!code || !name) {
                    huAdmin.toast('券码与名称必填', 'err');
                    return null;
                }
                var startTime = iso('#cfStart');
                var endTime = iso('#cfEnd');
                if (startTime && endTime && endTime < startTime) {
                    huAdmin.toast('可领截止不能早于开始时间', 'err');
                    return null;
                }
                var validDays = Number(val('#cfValidDays')) || 0;
                var validEndTime = iso('#cfValidEnd');
                if (validDays > 0 && validEndTime) {
                    huAdmin.toast('有效天数与固定到期时间只能填一个', 'err');
                    return null;
                }
                var scope = val('#cfScope');
                var categoryIds = picked('#cfCategories');
                if (scope === 'category' && !categoryIds.length) {
                    huAdmin.toast('请至少选择一个适用分类', 'err');
                    return null;
                }
                var ladder = val('#cfLadder');
                if (ladder && ladder.indexOf(':') < 0) {
                    huAdmin.toast('满减阶梯形如 199:20,399:60', 'err');
                    return null;
                }
                return {
                    code: code,
                    name: name,
                    type: type,
                    threshold: val('#cfThreshold') === '' ? 0 : Number(val('#cfThreshold')),
                    amount: type === 'cash' ? dec('#cfAmount') : null,
                    discountRate: type === 'discount' ? dec('#cfRate') : null,
                    maxDiscount: type === 'discount' ? dec('#cfMaxDiscount') : null,
                    total: Number(val('#cfTotal')) || 0,
                    perUserLimit: Number(val('#cfPerUser')) || 1,
                    perUserDailyLimit: Number(val('#cfDaily')) || 0,
                    newUserOnly: jQuery('#cfNew').is(':checked'),
                    memberOnly: jQuery('#cfMember').is(':checked'),
                    allowTransfer: jQuery('#cfTransfer').is(':checked'),
                    startTime: startTime,
                    endTime: endTime,
                    validDays: validDays,
                    validEndTime: validEndTime,
                    scope: scope,
                    categoryId: scope === 'category' && categoryIds.length ? categoryIds[0] : null,
                    categoryIds: scope === 'category' ? categoryIds : [],
                    productIds: picked('#cfProducts'),
                    ladderRule: ladder || null,
                    disablePolicy: val('#cfDisable'),
                    triggerScene: val('#cfScene'),
                    grantMinAmount: Number(val('#cfGrantMin')) || 0,
                    status: val('#cfStatus')
                };
            }

            /** 定向发券：拿到的同样是条款快照，后续改模板不影响这张券 */
            function openIssue(coupon) {
                jQuery.getJSON('/api/admin/users?page=1&limit=100', function (res) {
                    if (!res || res.code !== 200 || !res.data || !res.data.length) {
                        huAdmin.toast('用户列表加载失败', 'err');
                        return;
                    }
                    var options = res.data.map(function (u) {
                        return '<option value="' + esc(u.id) + '">' + esc(u.fullName || u.username || u.phone || u.id) +
                            (u.phone ? '（' + esc(u.phone) + '）' : '') + '</option>';
                    }).join('');
                    layer.open({
                        type: 1,
                        title: '发放「' + esc(coupon.name) + '」',
                        area: ['460px', '250px'],
                        content: '<form class="layui-form" style="padding:22px 24px 0">' +
                            field('选择用户', '<select id="ifUser" lay-search>' + options + '</select>') +
                            '<div class="layui-form-item"><div class="layui-input-block">' +
                            '<button type="button" class="layui-btn" id="ifSubmit">确认发放</button></div></div>' +
                            '</form>',
                        success: function () {
                            layui.form.render('select', null);
                            jQuery('#ifSubmit').on('click', function () {
                                huAdmin.request({
                                    url: '/api/admin/coupons/issue',
                                    type: 'POST',
                                    data: {couponId: coupon.id, userId: val('#ifUser')},
                                    ok: function () {
                                        layer.closeAll('page');
                                        reload();
                                    }
                                });
                            });
                        }
                    });
                }).fail(function () {
                    huAdmin.toast('用户列表加载失败', 'err');
                });
            }

            /* 列表里的「适用范围」与「分类/商品多选」都要显示真实名称，先取字典再渲染表格 */
            jQuery.when(
                jQuery.getJSON('/api/categories'),
                jQuery.getJSON('/api/admin/products?page=1&limit=300&isActive=true')
            ).done(function (catRes, productRes) {
                var c = catRes[0] || catRes;
                var p = productRes[0] || productRes;
                if (c && c.code === 200) categories = c.data || [];
                if (p && p.code === 200) products = p.data || [];
            }).always(function () {
                renderTable();
                loadStats();
            });

            window.huCouponAdd = function () {
                openForm(null);
            };
        });
    </script>
</body>
</html>
