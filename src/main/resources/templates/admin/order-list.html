<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>订单管理 - 花语轩管理后台</title>
    <link th:href="@{/layui-v2.13.9/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/css/admin-theme.css}" rel="stylesheet">
    <!-- f-g.css 提供 hu-admin-ui 的 fg-* 组件样式；f-c.css 只放本批次的 hu-admin-order-* -->
    <link th:href="@{/css/f-g.css}" rel="stylesheet">
    <link th:href="@{/css/f-c.css}" rel="stylesheet">
    <link th:href="@{/fontawesome/6.4.0/css/all.min.css}" rel="stylesheet">
    <style>
        body {background: #f1f1f1;}
        .order-status {padding: 3px 8px;border-radius: 3px;font-size: 12px;}
        .status-pending {background: #fff7e6;color: #fa8c16;}
        .status-paid {background: #e6f7ff;color: #1890ff;}
        .status-processing {background: #f9f0ff;color: #722ed1;}
        .status-shipped {background: #fff0f6;color: #eb2f96;}
        .status-delivered {background: #f6ffed;color: #52c41a;}
        .status-completed {background: #f6ffed;color: #52c41a;}
        .status-cancelled {background: #f5f5f5;color: #8c8c8c;}
        .status-refunded {background: #fff1f0;color: #f5222d;}
        .order-items {color: #666;font-size: 12px;}
        .express-no {font-size: 12px;color: #555;}
    </style>
</head>

                        <dl class="layui-nav-child">
                            <dd><a href="/admin/product-list"><i class="fas fa-box"></i> 商品列表</a></dd>

                        </dl>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;"><i class="fas fa-shopping-cart"></i> 订单管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="/admin/order-list"><i class="fas fa-list-alt"></i> 订单列表</a></dd>
                        </dl>

        <div class="layui-body" style="left: 200px;">

                <!-- C25 异常看板：一格一类，点进去就是按该口径筛好的列表 -->
                <div class="layui-card hu-admin-order-board">
                    <div class="layui-card-header">
                        <i class="fas fa-gauge-high"></i> 异常订单看板
                        <a class="hu-admin-order-board__reset" href="/admin/order-list">看全部订单</a>
                    </div>
                    <div class="layui-card-body">
                        <div class="fg-stats" id="anomalyBoard">
                            <div class="fg-stat"><span class="fg-stat__label">正在统计…</span>
                                <span class="fg-stat__num">—</span></div>
                        </div>
                    </div>
                </div>

                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="fas fa-list-alt"></i> 订单管理
                    </div>
                    <div class="layui-card-body">
                        <div class="layui-form hu-admin-order-search" lay-filter="searchForm">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">订单状态:</label>
                                    <div class="layui-input-inline">
                                        <select name="status">
                                            <option value="">全部</option>
                                            <option value="pending">待付款</option>
                                            <option value="paid">已付款</option>
                                            <option value="processing">处理中</option>
                                            <option value="shipped">已发货</option>
                                            <option value="delivered">已签收</option>
                                            <option value="completed">已完成</option>
                                            <option value="cancelled">已取消</option>

                                        </select>
                                    </div>
                                </div>
                                <!-- G21 异常单筛选项：与看板的三类共用服务端同一判定，页面不自己写条件 -->

                                    <div class="layui-input-inline">
                                        <select name="anomaly">
                                            <option value="">不限</option>
                                            <option value="any">全部异常</option>
                                            <option value="ship_overdue">超时未发货</option>
                                            <option value="pay_pending">长时间未付款</option>

                                    </div>
                                </div>

                                    <button class="layui-btn" lay-submit lay-filter="search">

                        <!-- G20 一键定位：粘订单号即可直达详情，不必先搜再翻 -->

        <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="freight" title="调整运费（需权限与原因）"><i class="fas fa-circle-dollar-to-slot"></i></a>

    <script th:src="@{/layui-v2.13.9/layui/layui.js}"></script>
    <script th:src="@{/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/site.js}"></script>
    <script th:src="@{/js/admin-common.js}"></script>
    <script th:src="@{/js/hu-admin-ui.js}"></script>
    <script th:inline="none">
        layui.use(['table', 'form', 'layer'], function(){
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var TABLE = 'orderTable';
            var URL = '/api/admin/orders';
            var FILTER_KEY = 'hu-admin-filter-order';
            var COLS_KEY = 'order-list';
            var state = huAdmin.listState('order');

            /** C11/C12 字典：服务端下发，页面只用 name 回认、用 trackUrlTemplate 的白名单域名开链接 */
            var ALLOWED_TRACK_HOSTS = ['www.kuaidi100.com', 'm.kuaidi100.com', 'www.17track.net'];
            var COMPANIES = [];
            var COMPANY_BY_NAME = {};
            var PERMS = {canAdjustFreight: false, freightMax: '999.00'};

            /** G19 可批量的目标：取消/退款要回补库存，只在行内逐单做 */
            var BATCH_STATUS = [
                {code: 'processing', name: '转处理中（开始备花）'},
                {code: 'delivered', name: '确认签收'},
                {code: 'completed', name: '标记完成'}
            ];

            function esc(value) { return huAdmin.esc(value === null || value === undefined ? '' : value); }

            var COLS = [
                {type: 'checkbox', fixed: 'left'},
                {field: 'orderNo', title: '订单号', width: 214, fixed: 'left', templet: function (d) {
                    /* 深链复制不挂 lay-event：Layui 只把带 lay-event 的元素按行数据回调，
                       这格要的是「不管表格内部怎么渲染都能点」，所以自己带 id 做事件委托 */
                    return '<div class="hu-admin-order-no">' + esc(d.orderNo)
                        + '<span class="hu-admin-order-inlinebtns">'
                        + '<button type="button" class="hu-admin-order-copy" data-hu-copy="' + esc(d.orderNo)
                        + '" data-hu-copy-label="订单号" title="复制订单号"><i class="fa fa-clipboard"></i></button>'
                        + '<button type="button" class="hu-admin-order-copy hu-admin-order-deeplink" data-id="'
                        + esc(d.id) + '" title="复制详情深链"><i class="fa fa-link"></i></button>'
                        + '</span></div>';
                }},
                {field: 'userName', title: '下单用户', width: 116, templet: function(d){
                    return esc(d.userName || '-') + '<br><small style="color:#999">' + esc(d.userPhone || '') + '</small>';
                }},
                {field: 'receiverName', title: '收货人', width: 132, templet: function(d){
                    return esc(d.receiverName) + '<br><small style="color:#999">' + esc(d.receiverPhone) + '</small>';
                }},
                {field: 'items', title: '商品', minWidth: 190, templet: '#itemsTpl'},
                {field: 'payAmount', title: '金额', width: 196, templet: '#amountTpl'},
                {field: 'status', title: '状态', width: 96, templet: '#statusTpl', align: 'center'},
                {field: 'payMethod', title: '支付', width: 80, align: 'center', templet: function(d){ return esc(d.payMethod || '-'); }},
                {field: 'deliveryMethodName', title: '配送', width: 96, templet: function(d){
                    return esc(d.deliveryMethodName || '标准配送')
                        + (d.deliveryPreferenceName ? '<br><small class="hu-admin-order-pref">' + esc(d.deliveryPreferenceName) + '</small>' : '');
                }},
                {field: 'expressNo', title: '物流（可复制 / 外部查询）', width: 246, templet: function (d) {
                    if (!d.expressNo) { return '<span style="color:#bbb">未发货</span>'; }
                    /* C12：单号进 data-hu-copy 由 site.js 统一复制；链接只用服务端下发且过白名单域名的模板 */
                    var url = trackUrlOf(d.expressCompany, d.expressNo);
                    return '<div class="hu-admin-order-express">'
                        + '<span class="hu-admin-order-express__co">' + esc(d.expressCompany || '快递') + '</span>'
                        + '<code id="no-' + esc(d.id) + '">' + esc(d.expressNo) + '</code>'
                        + '<span class="hu-admin-order-inlinebtns">'
                        + '<button type="button" class="hu-admin-order-copy" data-hu-copy="' + esc(d.expressNo)
                        + '" data-hu-copy-label="运单号" title="复制运单号"><i class="fa fa-clipboard"></i></button>'
                        + (url ? '<a class="hu-admin-order-track" href="' + esc(url)
                            + '" target="_blank" rel="noopener noreferrer" title="在新窗口查询物流">'
                            + '<i class="fa fa-arrow-up-right-from-square"></i></a>' : '')
                        + '</span></div>';
                }},
                {field: 'createdAt', title: '下单时间', width: 165, templet: function(d){
                    return d.createdAt ? new Date(d.createdAt).toLocaleString() : '-';
                }},
                {title: '操作', width: 260, toolbar: '#operateTpl', fixed: 'right'}
            ];
            huAdminUI.applyHidden(COLS, COLS_KEY);

            function currentFilter() {
                try { return JSON.parse(sessionStorage.getItem(FILTER_KEY) || '{}'); } catch (e) { return {}; }
            }

            function buildWhere(f) {
                var where = {};
                if (f.status) where.status = f.status;
                if (f.anomaly) where.anomaly = f.anomaly;
                if (f.keyword) where.keyword = f.keyword;
                return where;
            }

            function hasFilter(f) {
                f = f || currentFilter();
                return !!(f.status || f.anomaly || f.keyword);
            }

            var ANOMALY_NAMES = {any: '全部异常', ship_overdue: '超时未发货', pay_pending: '长时间未付款', refunding: '退款跟进中'};

            function refreshTip(f) {
                f = f || currentFilter();
                var parts = [];
                if (f.anomaly) parts.push('异常口径「' + (ANOMALY_NAMES[f.anomaly] || f.anomaly) + '」');
                if (f.status) parts.push('状态「' + f.status + '」');
                if (f.keyword) parts.push('关键词「' + f.keyword + '」');
                $('#filterTip').html(parts.length
                    ? '<b>当前条件：</b>' + esc(parts.join(' · ')) + '<a href="javascript:;" id="tipClear">清除</a>'
                    : '勾选行首的复选框可批量发货 / 批量流转；异常看板的数字与这里是同一套判定。');
                jQuery('#tipClear').on('click', function(){ jQuery('#btnReset').trigger('click'); });
            }

            var hooks = huAdminUI.tableHooks(TABLE, {
                url: URL, state: state,
                hasFilter: function () { return hasFilter(); }
            });

            table.render({
                elem: '#' + TABLE,
                url: URL,
                cols: [COLS],
                toolbar: '#toolbar',
                /* 列筛选只保留「列设置」一条路径：Layui 自带的列显隐不记忆，两套并存一定对不上 */
                defaultToolbar: [],
                page: huAdminUI.pageConfig(state, {limits: [10, 20, 30, 50, 100]}),
                limit: state.limit(10),
                limits: [10, 20, 30, 50, 100],
                done: hooks.done,
                error: hooks.error
            });

            /* ---------- C25 异常看板 ---------- */

            function renderBoard() {
                huAdmin.request({url: URL + '/anomaly-summary', silent: true, ok: function (res) {
                    var cards = res.data || [];
                    var html = cards.map(function (card) {
                        var zero = !card.count;
                        return '<button type="button" class="fg-stat hu-admin-order-tile'
                            + (zero ? ' is-empty' : ' hu-admin-order-tile--' + card.code)
                            + '" data-anomaly="' + esc(card.code) + '" title="' + esc(card.rule) + '">'
                            + '<span class="fg-stat__label">' + esc(card.label) + '</span>'
                            + '<span class="fg-stat__num">' + (card.count || 0) + '<small>笔</small></span>'
                            + '<span class="fg-stat__sub">' + esc(card.rule) + '</span></button>';
                    }).join('');
                    jQuery('#anomalyBoard').html(html || '<div class="fg-stat"><span class="fg-stat__label">看板</span>'
                        + '<span class="fg-stat__num">—</span></div>');
                }});
            }

            jQuery('#anomalyBoard').on('click', '.hu-admin-order-tile', function () {
                var code = this.getAttribute('data-anomaly');
                applyFilter({anomaly: code, status: '', keyword: currentFilter().keyword || ''});
            });

            /* ---------- 筛选 ---------- */

            function applyFilter(f) {
                sessionStorage.setItem(FILTER_KEY, JSON.stringify(f));
                state.reset();
                form.val('searchForm', {status: f.status || '', anomaly: f.anomaly || '', keyword: f.keyword || ''});
                refreshTip(f);
                table.reload(TABLE, {where: buildWhere(f), page: {curr: 1}});
            }

            form.on('submit(search)', function (data) {
                applyFilter(data.field);
                return false;
            });

            jQuery('#btnReset').on('click', function () {
                sessionStorage.removeItem(FILTER_KEY);
                state.reset();
                form.val('searchForm', {status: '', anomaly: '', keyword: ''});
                refreshTip({});
                table.reload(TABLE, {where: {}, page: {curr: 1}});
            });

            /* ---------- G20 一键定位 ---------- */

            function openDetail(id) {
                layer.open({type: 2, title: '订单详情', area: ['92%', '86%'],
                    content: '/admin/order-detail/' + encodeURIComponent(id)});
            }

            function locate() {
                var q = jQuery.trim(jQuery('#locateInput').val());
                if (!q) { layer.msg('先粘贴要定位的订单号或运单号', {icon: 7}); return; }
                huAdmin.request({url: URL + '/locate', data: {q: q}, silent: true, ok: function (res) {
                    var rows = res.data || [];
                    if (!rows.length) {
                        jQuery('#locateTip').text('没有匹配「' + q + '」的订单，换个条件试试');
                        huAdminUI.showEmpty(TABLE, {hasFilter: function () { return true; }});
                        return;
                    }
                    if (rows.length === 1 || rows[0].exact) {
                        applyFilter({keyword: rows[0].orderNo, status: '', anomaly: ''});
                        openDetail(rows[0].id);
                        return;
                    }
                    pickCandidate(rows, q);
                }, fail: function (res) {
                    jQuery('#locateTip').text(res.msg || '定位失败');
                }});
            }

            function pickCandidate(rows, q) {
                var html = '<div class="hu-admin-order-pick"><p>匹配到 ' + rows.length + ' 笔，点一条直接打开：</p><ul>'
                    + rows.map(function (r) {
                        return '<li><button type="button" class="hu-admin-order-pick__row" data-id="' + esc(r.id) + '">'
                            + '<b>' + esc(r.orderNo) + '</b><span>' + esc(r.statusLabel) + ' · ' + esc(r.receiverName)
                            + (r.expressNo ? ' · ' + esc(r.expressNo) : '') + '</span><em>' + esc(r.createdAt) + '</em>'
                            + '</button></li>';
                    }).join('') + '</ul></div>';
                layer.open({type: 1, title: '定位「' + esc(q) + '」', area: ['520px', 'auto'], content: html,
                    success: function (layero) {
                        jQuery(layero).on('click', '.hu-admin-order-pick__row', function () {
                            layer.closeAll('page');
                            openDetail(this.getAttribute('data-id'));
                        });
                    }});
            }

            jQuery('#btnLocate').on('click', locate);
            jQuery('#locateInput').on('keydown', function (e) { if (e.keyCode === 13) { locate(); } });

            /* ---------- 字典与权限 ---------- */

            function loadCompanies(done) {
                huAdmin.request({url: URL + '/shipping-companies', silent: true, ok: function (res) {
                    COMPANIES = res.data || [];
                    COMPANY_BY_NAME = {};
                    COMPANIES.forEach(function (c) { COMPANY_BY_NAME[c.name] = c; });
                    if (done) done();
                }});
            }

            function loadPerms() {
                huAdmin.request({url: URL + '/permissions', silent: true, ok: function (res) {
                    if (res.data) { PERMS = res.data; }
                }});
            }

            /** C12：链接的域名必须同时在服务端与页面这道白名单里，运单号只做 URL 编码 */
            function trackUrlOf(companyName, expressNo) {
                var company = COMPANY_BY_NAME[companyName];
                if (!company || !company.trackUrlTemplate || !expressNo) { return ''; }
                var matched = /^https:\/\/([^/]+)\//.exec(company.trackUrlTemplate);
                if (!matched || ALLOWED_TRACK_HOSTS.indexOf(matched[1]) < 0) { return ''; }
                return company.trackUrlTemplate.replace('__NO__', encodeURIComponent(expressNo));
            }

            /* ---------- C11 / C22 发货（单笔与批量同一个弹层） ---------- */

            function shipRowsHtml(rows) {
                return rows.map(function (row, i) {
                    return '<tr><td>' + esc(row.orderNo) + '<br><small style="color:#999">' + esc(row.receiverName || '')
                        + '</small></td><td><input type="text" class="layui-input" name="expressNo-' + i
                        + '" data-order="' + esc(row.id) + '" autocomplete="off" placeholder="运单号"></td></tr>';
                }).join('');
            }

            function companyOptions(active) {
                return COMPANIES.map(function (c) {
                    return '<option value="' + esc(c.code) + '"' + (c.code === active ? ' selected' : '') + '>'
                        + esc(c.name) + '</option>';
                }).join('');
            }

            function ruleHint(code) {
                var c = null;
                COMPANIES.forEach(function (item) { if (item.code === code) c = item; });
                return c ? ('单号规则：' + c.noHint + '，示例 ' + c.noExample) : '选择物流公司后按该公司规则校验单号';
            }

            var SHIP_RULES = [{field: 'expressCompanyCode', test: /物流公司/}];
            var SHIP_RULES_SINGLE = SHIP_RULES.concat([{field: 'expressNo-0', test: /单号|运单/}]);

            function openShipDialog(rows) {
                var html = '<form class="layui-form fg-dlg" id="shipForm" lay-filter="shipForm">'
                    + '<div class="layui-form-item"><label class="layui-form-label">物流公司</label>'
                    + '<div class="layui-input-block"><select name="expressCompanyCode" id="shipCompany">'
                    + companyOptions(COMPANIES.length ? COMPANIES[0].code : '') + '</select></div></div>'
                    + '<p class="hu-admin-order-rule" id="shipRule">' + esc(ruleHint(COMPANIES.length ? COMPANIES[0].code : '')) + '</p>'
                    + (rows.length > 1
                        ? '<div class="layui-form-item layui-form-text"><label class="layui-form-label">批量粘贴</label>'
                            + '<div class="layui-input-block"><textarea id="shipPaste" class="layui-textarea" rows="2" '
                            + 'placeholder="每行一条：订单号,运单号（整批同一单号时直接写一次即可）"></textarea></div></div>'
                        : '')
                    + '<table class="layui-table hu-admin-order-ship" lay-size="sm"><thead><tr>'
                    + '<th style="width:190px">订单</th><th>运单号</th></tr></thead>'
                    + '<tbody>' + shipRowsHtml(rows) + '</tbody></table>'
                    + '<p class="hu-admin-order-note">发货会写入履约轨迹与操作留痕；'
                    + (rows.length > 1 ? '逐条独立提交，失败的那条不影响已发货的。' : '') + '</p></form>';

                layer.open({
                    type: 1, title: (rows.length > 1 ? '批量发货 · ' + rows.length + ' 笔' : '发货 · ' + rows[0].orderNo),
                    area: rows.length > 1 ? ['640px', '600px'] : ['520px', 'auto'], content: html,
                    btn: ['确认发货', '取消'],
                    success: function (layero) {
                        form.render('select', 'shipForm');
                        huAdminUI.clearFields(layero);
                        jQuery(layero).find('#shipCompany').on('change', function () {
                            jQuery(layero).find('#shipRule').text(ruleHint(this.value));
                        });
                        jQuery(layero).find('#shipPaste').on('blur', function () {
                            var map = {};
                            String(this.value).split(/[\r\n]+/).forEach(function (line) {
                                var pair = line.split(/[,，\s]+/);
                                if (pair.length >= 2) { map[pair[0].trim()] = pair[1].trim(); }
                            });
                            rows.forEach(function (row, i) {
                                var found = map[row.orderNo];
                                if (found) { jQuery(layero).find('[name="expressNo-' + i + '"]').val(found); }
                            });
                        });
                    },
                    yes: function (index, layero) {
                        var company = jQuery(layero).find('[name="expressCompanyCode"]').val();
                        if (!company) { huAdminUI.markField(layero, 'expressCompanyCode', '请选择物流公司'); return; }
                        var lines = [], missing = false;
                        rows.forEach(function (row, i) {
                            var input = jQuery(layero).find('[name="expressNo-' + i + '"]');
                            var no = jQuery.trim(input.val());
                            if (!no) {
                                missing = true;
                                huAdminUI.markField(layero, 'expressNo-' + i, '这条的运单号还没填');
                            }
                            lines.push({orderId: row.id, expressNo: no});
                        });
                        if (missing) {
                            layer.msg('每条订单都要有自己的运单号', {icon: 2});
                            return;
                        }
                        huAdminUI.clearFields(layero);
                        var payload = rows.length > 1
                            ? {url: '/batch-ship', data: {expressCompanyCode: company, lines: lines}}
                            : {url: '/' + rows[0].id + '/ship', data: {expressCompanyCode: company, expressNo: lines[0].expressNo}};
                        huAdmin.request({
                            url: URL + payload.url, type: 'POST', data: payload.data, silent: true,
                            ok: function (res) {
                                layer.close(index);
                                if (rows.length > 1) { huAdminUI.batchReceipt(res, function () { openShipDialog(rows); }); }
                                else { layer.msg(res.msg || '发货成功', {icon: 1}); }
                                table.reload(TABLE);
                                renderBoard();
                            },
                            fail: function (res) {
                                /* 批量时单号问题走逐条回执，这里只可能是公司或参数不合法 */
                                huAdminUI.applyServerErrors(layero, res, rows.length > 1 ? SHIP_RULES : SHIP_RULES_SINGLE);
                            }
                        });
                    }
                });
            }

            /* ---------- G19 批量流转 ---------- */

            function openBatchStatus(rows) {
                var html = '<form class="layui-form fg-dlg" id="batchStatusForm" lay-filter="batchStatusForm">'
                    + '<div class="layui-form-item"><label class="layui-form-label">目标状态</label>'
                    + '<div class="layui-input-block"><select name="status">'
                    + BATCH_STATUS.map(function (s) { return '<option value="' + s.code + '">' + esc(s.name) + '</option>'; }).join('')
                    + '</select></div></div>'
                    + '<div class="layui-form-item"><label class="layui-form-label">说明</label>'
                    + '<div class="layui-input-block"><input type="text" name="reason" class="layui-input" maxlength="200" '
                    + 'placeholder="选填，会写进这一批订单的轨迹与操作留痕"></div></div>'
                    + '<p class="hu-admin-order-note">已选中 ' + rows.length + ' 笔：'
                    + esc(rows.slice(0, 6).map(function (r) { return r.orderNo; }).join('、'))
                    + (rows.length > 6 ? ' 等 ' + rows.length + ' 笔' : '') + '</p></form>';
                layer.open({
                    type: 1, title: '批量流转 · ' + rows.length + ' 笔', area: ['540px', 'auto'], content: html,
                    btn: ['下一步', '取消'],
                    success: function () { form.render('select', 'batchStatusForm'); },
                    yes: function (index, layero) {
                        var f = form.val('batchStatusForm');
                        var target = BATCH_STATUS.filter(function (s) { return s.code === f.status; })[0];
                        layer.close(index);
                        huAdminUI.confirmDanger({
                            title: '确认批量流转', subject: '将把 ' + rows.length + ' 笔订单变更为「' + target.name + '」。',
                            consequences: [
                                '逐条按「当前状态 → 目标状态」校验，不合法的那条不会写入，会在结果里单列原因。',
                                '取消、退款与确认收款要回补库存和优惠券，不在这个批量里，请在行内逐单操作。',
                                '每条都会写履约轨迹与操作留痕。'
                            ],
                            confirmText: '确认执行', requireAck: true,
                            onOk: function () {
                                huAdmin.request({
                                    url: URL + '/batch-status', type: 'POST',
                                    data: {ids: rows.map(function (r) { return r.id; }), status: f.status, reason: f.reason},
                                    ok: function (res) {
                                        huAdminUI.batchReceipt(res);
                                        table.reload(TABLE);
                                        renderBoard();
                                    }
                                });
                            }
                        });
                    }
                });
            }

            function needSelection(callback) {
                var rows = table.checkStatus(TABLE).data || [];
                if (!rows.length) { layer.msg('先勾选要处理的订单', {icon: 7}); return; }
                callback(rows);
            }

            /* ---------- C23 备注 / C24 运费 ---------- */

            function openRemarkDialog(row) {
                var html = '<form class="layui-form fg-dlg" id="remarkForm" lay-filter="remarkForm">'
                    + '<div class="layui-form-item"><label class="layui-form-label">当前备注</label>'
                    + '<div class="layui-input-block"><textarea class="layui-textarea" rows="2" readonly '
                    + 'style="background:#f6f5f1">' + esc(row.remark || '（空）') + '</textarea></div></div>'
                    + '<div class="layui-form-item layui-form-text"><label class="layui-form-label">改为</label>'
                    + '<div class="layui-input-block"><textarea name="remark" class="layui-textarea" maxlength="500" '
                    + 'placeholder="留空即清空备注">' + esc(row.remark || '') + '</textarea></div></div>'
                    + '<div class="layui-form-item"><label class="layui-form-label">修改原因</label>'
                    + '<div class="layui-input-block"><input type="text" name="reason" class="layui-input" maxlength="200" '
                    + 'placeholder="必填：谁要求的、依据什么改"></div></div></form>';
                layer.open({
                    type: 1, title: '订单备注 · ' + esc(row.orderNo), area: ['560px', 'auto'], content: html,
                    btn: ['保存', '取消'],
                    success: function (layero) { huAdminUI.clearFields(layero); },
                    yes: function (index, layero) {
                        var f = form.val('remarkForm');
                        if (!f.reason || f.reason.trim().length < 4) {
                            huAdminUI.markField(layero, 'reason', '请填写至少 4 个字的修改原因');
                            return;
                        }
                        huAdminUI.clearFields(layero);
                        huAdmin.request({
                            url: URL + '/' + row.id + '/remark', type: 'PUT',
                            data: {remark: f.remark, reason: f.reason}, silent: true,
                            ok: function (res) {
                                layer.close(index);
                                layer.msg(res.msg || '备注已更新', {icon: 1});
                                table.reload(TABLE);
                            },
                            fail: function (res) {
                                huAdminUI.applyServerErrors(layero, res, [
                                    {field: 'reason', test: /原因/},
                                    {field: 'remark', test: /备注/}
                                ]);
                            }
                        });
                    }
                });
            }

            function openFreightDialog(row) {
                if (!PERMS.canAdjustFreight) {
                    layer.msg('当前账号不在可调整运费的名单里，请联系有权限的同事', {icon: 2});
                    return;
                }
                var current = Number(row.freight || 0);
                var html = '<form class="layui-form fg-dlg" id="freightForm" lay-filter="freightForm">'
                    + '<div class="layui-form-item"><label class="layui-form-label">当前运费</label>'
                    + '<div class="layui-input-inline" style="width:120px"><input class="layui-input" value="¥'
                    + huAdmin.money(current) + '" readonly style="background:#f6f5f1"></div>'
                    + '<div class="layui-form-mid layui-word-aux">含礼品包装费；当前实付 ¥'
                    + huAdmin.money(row.payAmount) + '</div></div>'
                    + '<div class="layui-form-item"><label class="layui-form-label">调整为</label>'
                    + '<div class="layui-input-inline" style="width:120px"><input type="number" step="0.01" min="0" '
                    + 'max="999" name="freight" class="layui-input" placeholder="0.00"></div>'
                    + '<div class="layui-form-mid layui-word-aux">可填 ¥0.00 ~ ¥' + esc(PERMS.freightMax) + '</div></div>'
                    + '<div class="layui-form-item"><label class="layui-form-label">调整原因</label>'
                    + '<div class="layui-input-block"><input type="text" name="reason" class="layui-input" maxlength="200" '
                    + 'placeholder="必填：如 客服承诺免运费 / 冷链改普送退差价"></div></div>'
                    + '<p class="hu-admin-order-note">实付 = 商品总额 − 优惠 + 运费，由服务端按下单同一口径重算，'
                    + '抵扣到 0 时仍按 ¥0.01 收。</p></form>';
                layer.open({
                    type: 1, title: '调整运费 · ' + esc(row.orderNo), area: ['560px', 'auto'], content: html,
                    btn: ['下一步', '取消'],
                    success: function (layero) { huAdminUI.clearFields(layero); },
                    yes: function (index, layero) {
                        var f = form.val('freightForm');
                        if (f.freight === '' || Number(f.freight) < 0) {
                            huAdminUI.markField(layero, 'freight', '请填写调整后的运费');
                            return;
                        }
                        if (!f.reason || f.reason.trim().length < 4) {
                            huAdminUI.markField(layero, 'reason', '请填写至少 4 个字的调整原因');
                            return;
                        }
                        var next = Number(f.freight).toFixed(2);
                        var payGuess = Number(row.totalAmount || 0) - Number(row.discountAmount || 0) + Number(next);
                        if (payGuess < 0.01) { payGuess = 0.01; }
                        huAdminUI.confirmDanger({
                            title: '确认调整运费',
                            subject: '「' + row.orderNo + '」运费 ¥' + huAdmin.money(current) + ' → ¥' + next + '。',
                            consequences: [
                                '实付金额会同步重算为 ¥' + huAdmin.money(payGuess) + '，买家端看到的价格随之变化。',
                                '已发货或已关单的订单不允许再改金额，这条会被服务端挡回。',
                                '改前改后的运费与实付、调整原因都写进操作留痕，可在详情页回查。'
                            ],
                            note: '原因：' + f.reason,
                            confirmText: '确认调整', requireAck: true,
                            onOk: function () {
                                huAdmin.request({
                                    url: URL + '/' + row.id + '/freight', type: 'POST',
                                    data: {freight: Number(next), reason: f.reason}, silent: true,
                                    ok: function (res) {
                                        layer.close(index);
                                        layer.msg(res.msg || '运费已调整', {icon: 1});
                                        table.reload(TABLE);
                                    },
                                    fail: function (res) {
                                        /* 表单层不关：错误要钉回具体那一格，而不是让运营重填一遍 */
                                        huAdminUI.applyServerErrors(layero, res, [
                                            {field: 'freight', test: /运费/},
                                            {field: 'reason', test: /原因/}
                                        ]);
                                    }
                                });
                            }
                        });
                    }
                });
            }

            /* ---------- 表格事件 ---------- */

            function transit(data, target, message) {
                layer.confirm(message, {icon: 3, title: '请确认'}, function (index) {
                    layer.close(index);
                    huAdmin.request({
                        url: URL + '/' + data.id + '/status',
                        type: 'POST', data: {status: target},
                        ok: function (res) {
                            layer.msg(res.msg || '操作成功', {icon: 1});
                            table.reload(TABLE);
                            renderBoard();
                        }
                    });
                });
            }

            /** 带原因的跃迁（取消/退款）：原因写入 cancel_reason，便于售后追溯 */
            function transitWithReason(data, target, title, message) {
                layer.prompt({title: title, formType: 2, placeholder: message, maxlength: 200}, function (value, index) {
                    layer.close(index);
                    huAdmin.request({
                        url: URL + '/' + data.id + '/status',
                        type: 'POST', data: {status: target, reason: value},
                        ok: function (res) {
                            layer.msg(res.msg || '操作成功', {icon: 1});
                            table.reload(TABLE);
                            renderBoard();
                        }
                    });
                });
            }

            table.on('toolbar(' + TABLE + ')', function (obj) {
                var f = currentFilter();
                if (obj.event === 'refresh') { table.reload(TABLE); renderBoard(); }
                else if (obj.event === 'cols') { huAdminUI.openColumnPicker(TABLE, COLS, COLS_KEY); }
                else if (obj.event === 'batchShip') {
                    needSelection(function (rows) {
                        var shipable = rows.filter(function (r) { return r.status === 'paid' || r.status === 'processing'; });
                        if (!shipable.length) {
                            layer.msg('勾选的 ' + rows.length + ' 笔里没有可发货的订单（要已付款或处理中）', {icon: 2});
                            return;
                        }
                        if (shipable.length < rows.length) {
                            layer.msg('已跳过 ' + (rows.length - shipable.length) + ' 笔状态不符的订单', {icon: 0});
                        }
                        openShipDialog(shipable.map(function (r) {
                            return {id: r.id, orderNo: r.orderNo, receiverName: r.receiverName};
                        }));
                    });
                } else if (obj.event === 'batchStatus') {
                    needSelection(function (rows) { openBatchStatus(rows); });
                } else if (obj.event === 'export') {
                    var where = buildWhere(f);
                    var pairs = Object.keys(where).map(function (k) {
                        return encodeURIComponent(k) + '=' + encodeURIComponent(where[k]);
                    });
                    window.location.href = URL + '/export' + (pairs.length ? '?' + pairs.join('&') : '');
                }
            });

            table.on('tool(' + TABLE + ')', function (obj) {
                var data = obj.data;
                if (obj.event === 'detail') {
                    openDetail(data.id);
                } else if (obj.event === 'ship') {
                    openShipDialog([{id: data.id, orderNo: data.orderNo, receiverName: data.receiverName}]);
                } else if (obj.event === 'process') {
                    transit(data, 'processing', '将该订单标记为「处理中」（开始包花）？');
                } else if (obj.event === 'delivered') {
                    transit(data, 'delivered', '确认买家已签收该订单？');
                } else if (obj.event === 'complete') {
                    transit(data, 'completed', '完成该订单？完成后不可再变更状态。');
                } else if (obj.event === 'cancel') {
                    transitWithReason(data, 'cancelled', '取消原因', '请填写取消原因，库存将自动回补');
                } else if (obj.event === 'refund') {
                    transitWithReason(data, 'refunded', '退款原因', '请填写退款原因，库存与销量将自动回补');
                } else if (obj.event === 'remark') {
                    openRemarkDialog(data);
                } else if (obj.event === 'freight') {
                    openFreightDialog(data);
                }
            });

            function copyDeepLink(data) {
                var link = location.origin + '/admin/order-detail/' + data.id;
                if (window.huCopy) { huCopy(link, '详情链接'); }
                else { layer.msg('浏览器不支持自动复制，请手动选中地址栏', {icon: 2}); }
            }

            /* 事件委托挂在 document 上：Layui 重绘行之后新按钮一样能点 */
            jQuery(document).on('click', '.hu-admin-order-deeplink', function () {
                copyDeepLink({id: this.getAttribute('data-id')});
            });

            /* ---------- 初始化：URL 参数优先于本 tab 记住的筛选（G20 深链） ---------- */

            (function boot() {
                loadCompanies(function () { table.reload(TABLE); });
                loadPerms();
                renderBoard();

                var urlKeyword = huAdmin.param('keyword');
                var urlAnomaly = huAdmin.param('anomaly');
                var openId = huAdmin.param('open');
                var f = currentFilter();
                if (urlKeyword || urlAnomaly) {
                    f = {keyword: urlKeyword || f.keyword || '', anomaly: urlAnomaly || '', status: ''};
                    sessionStorage.setItem(FILTER_KEY, JSON.stringify(f));
                }
                if (hasFilter(f)) {
                    form.val('searchForm', f);
                    table.reload(TABLE, {where: buildWhere(f), page: {curr: state.pageConfig().curr || 1}});
                }
                refreshTip(f);
                if (openId) { openDetail(openId); }
            })();
        });
    </script>
</body>
</html>
