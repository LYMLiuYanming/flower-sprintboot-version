<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/head :: resources}"></th:block>
    <title>自提门店 · 花语轩</title>
</head>
<body class="hu-body">
<div th:replace="~{common/header :: header}"></div>
<th:block th:replace="~{common/amap :: loader}"></th:block>

<div class="hu-pagehead">
    <div class="hu-container hu-pagehead__row">
        <div>
            <div class="hu-crumb"><a href="/index">首页</a> / <span>自提门店</span></div>
            <h1>自提门店</h1>
            <p class="hu-pagehead__sub">到店自提免运费，提前 2 小时下单可让花艺师现场分装</p>
        </div>
        <div class="hu-pagehead__aside">
            <span class="hu-muted" style="font-size:13px">可自提门店</span>
            <div class="hu-num" id="storeCount" style="font-size:26px" th:text="${#lists.size(stores)}">0</div>
        </div>
    </div>
</div>

<div class="hu-container">
    <div class="hu-mapwrap">
        <div class="hu-mapwrap__side">
            <div class="hu-panel hu-panel--pad">
                <h3 class="hu-side-title" style="margin-top:0">就近推荐</h3>
                <div class="hu-field" style="margin-bottom:10px">
                    <label for="nearAddress">收货地址 / 城市</label>
                    <input type="text" id="nearAddress" class="hu-input" maxlength="120"
                           th:value="${nearAddress}" placeholder="例如 北京市朝阳区金台夕照路 8 号">
                    <div class="hu-field__hint" id="nearHint">填地址可按距离排序；只填城市名也能用（内置城市质心兜底）。</div>
                </div>
                <button type="button" class="hu-btn hu-btn--solid hu-btn--sm" id="nearBtn">
                    <i class="fa fa-crosshairs"></i>&nbsp;找最近门店
                </button>
                <div class="hu-chips" id="cityChips" style="margin-top:14px"></div>
            </div>

            <div class="hu-panel hu-panel--pad" style="margin-top:16px">
                <div id="nearNote" class="hu-muted" style="font-size:12.5px;margin-bottom:10px"></div>
                <div id="storeList" class="hu-stores"></div>
            </div>
        </div>

        <div class="hu-mapwrap__main">
            <div id="mapCanvas" class="hu-map"></div>
            <div id="mapFallback" class="hu-empty" style="display:none;position:absolute;inset:0">
                <i class="fa fa-map-o"></i>
                <strong>底图暂不可用</strong>
                <span style="font-size:13px">左侧门店地址、电话与营业时间仍可正常查看，下单不受影响</span>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{common/footer :: footer}"></div>

<script th:inline="javascript">
    /* 服务端先渲染一份门店列表：地图脚本失败、接口超时都不影响这页读出可用信息 */
    const SERVER_STORES = /*[[${stores}]]*/ [];
    let map = null;
    let AMapRef = null;
    let overlay = [];
    let stores = SERVER_STORES || [];

    function esc(v) {
        return window.huEscape(v == null ? '' : String(v));
    }

    function km(v) {
        return v == null ? '' : (v < 10 ? Math.round(v * 10) / 10 : Math.round(v)) + ' 公里';
    }

    function card(s, i) {
        return '<div class="hu-store' + (s.recommended ? ' is-recommended' : '') + '">' +
            '<div class="hu-store__head"><b>' + esc(s.name) + '</b>' +
            (s.recommended ? '<span class="hu-store__badge">最近</span>' : '') +
            (s.distanceKm != null ? '<span class="hu-store__km">' + km(s.distanceKm)
                + (s.sameCity ? '' : ' · 跨城') + '</span>' : '') + '</div>' +
            '<p class="hu-store__addr"><i class="fa fa-map-marker"></i> ' + esc(s.address || (s.city || '') + '（地址待补充）') + '</p>' +
            '<p class="hu-store__meta">' + (s.openHours ? '<span><i class="fa fa-clock-o"></i> ' + esc(s.openHours) + '</span>' : '') +
            (s.phone ? '<span><i class="fa fa-phone"></i> ' + esc(s.phone) + '</span>' : '') +
            (s.pickupReadyMinutes ? '<span><i class="fa fa-scissors"></i> 备花约 ' + s.pickupReadyMinutes + ' 分钟</span>' : '') + '</p>' +
            (s.readyAt ? '<p class="hu-store__ready"><i class="fa fa-check-circle"></i> 现在下单，' + esc(s.readyAt) + '</p>' : '') +
            (s.feature ? '<p class="hu-store__feature">' + esc(s.feature) + '</p>' : '') +
            '<a class="hu-store__cta" href="/products?sort=new">去下单，结算时选「门店自提」</a>' +
            '</div>';
    }

    function render() {
        $('#storeCount').text(stores.length);
        $('#storeList').html(stores.length ? stores.map(card).join('')
            : '<p class="hu-muted" style="font-size:13px">该城市暂无自提门店，可切换其他城市或选择同城闪送</p>');
        if (!map) {
            return;
        }
        overlay.forEach(function (o) { map.remove(o); });
        overlay = [];
        const items = [];
        stores.forEach(function (s, i) {
            const marker = new AMapRef.Marker({
                position: [s.lng, s.lat],
                anchor: 'center',
                content: '<div class="hu-pin hu-pin--store' + (s.recommended ? ' hu-pin--recommend' : '') + '"'
                    + ' title="' + esc(s.name) + '"><i class="fa fa-store"></i>'
                    + (s.recommended ? '<em>' + (i + 1) + '</em>' : '') + '</div>'
            });
            marker.on('click', function () {
                map.setZoomAndCenter(11, [s.lng, s.lat]);
            });
            items.push(marker);
            items.push(new AMapRef.Text({
                text: s.name.replace('花语轩·', '') + (s.distanceKm != null ? ' ' + km(s.distanceKm) : ''),
                position: [s.lng, s.lat],
                anchor: 'top_center',
                offset: new AMapRef.Pixel(0, 14),
                style: {background: 'rgba(255,255,255,.9)', border: '1px solid #e2e6ea', color: '#1c2430',
                    padding: '2px 7px', 'border-radius': '6px', 'font-size': '12px'}
            }));
        });
        overlay = items;
        map.add(items);
        if (items.length) {
            map.setFitView(items, false, [50, 50, 50, 50]);
        }
    }

    function initMap() {
        window.huAmap.ready(function (AMap) {
            AMapRef = AMap;
            map = new AMap.Map('mapCanvas', {
                zoom: 4.4, center: [105.5, 33.5], viewMode: '2D',
                mapStyle: 'amap://styles/whitesmoke', resizeEnable: true, scrollWheel: true
            });
            map.addControl(new AMap.ToolBar({position: {right: '18px', bottom: '48px'}}));
            map.addControl(new AMap.Scale());
            render();
        }, function (message) {
            $('#mapFallback').show();
            render();
        });
    }

    function loadNearby() {
        const address = ($('#nearAddress').val() || '').trim();
        huApi({
            url: '/api/stores/nearby',
            data: {address: address, limit: 8},
            silent: true,
            ok: function (data) {
                if (!data) {
                    return;
                }
                stores = data.stores || [];
                $('#nearNote').text((address ? '按「' + address + '」就近排序：' : '')
                    + (data.note || '') + (data.resolution === 'city' ? '（按城市质心，实际距离略有偏差）' : ''));
                render();
            },
            fail: function () {
                $('#nearNote').text('就近排序暂时不可用，已按城市列出全部门店');
            }
        });
    }

    function loadCities() {
        huApi({
            url: '/api/stores/cities',
            silent: true,
            ok: function (data) {
                const cities = data || [];
                if (cities.length < 2) {
                    return;
                }
                $('#cityChips').html('<button type="button" class="hu-chip is-active" data-city="">全部</button>'
                    + cities.map(function (c) {
                        return '<button type="button" class="hu-chip" data-city="' + esc(c) + '">' + esc(c) + '</button>';
                    }).join(''));
            }
        });
    }

    $(function () {
        initMap();
        render();
        loadCities();
        $('#nearBtn').on('click', loadNearby);
        $('#nearAddress').on('keydown', function (e) {
            if (e.key === 'Enter') {
                loadNearby();
            }
        });
        $('#cityChips').on('click', '.hu-chip', function () {
            $('#cityChips .hu-chip').removeClass('is-active');
            $(this).addClass('is-active');
            const city = $(this).data('city') || '';
            huApi({
                url: '/api/stores',
                data: {city: city},
                silent: true,
                ok: function (data) {
                    stores = data || [];
                    $('#nearNote').text(city ? city + ' 的自提门店' : '');
                    render();
                }
            });
        });
        if ($('#nearAddress').val()) {
            loadNearby();
        }
    });
</script>
</body>
</html>
