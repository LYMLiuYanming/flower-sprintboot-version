<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/head :: resources}"></th:block>
    <title>收货地址 · 花语轩</title>
    <style>
        /* 页面专属样式：公共令牌与组件均来自 theme.css */
        .hu-field__req { color: var(--hu-clay); margin-left: 3px; }
        .hu-form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
        .hu-addr-list { display: flex; flex-direction: column; gap: 14px; }

        .hu-addr {
            display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap;
            padding: 20px 22px; border: 1px solid var(--hu-line); border-radius: var(--hu-radius-lg);
            background: var(--hu-surface); box-shadow: var(--hu-shadow-sm);
            transition: border-color .28s var(--hu-ease), box-shadow .28s var(--hu-ease), transform .28s var(--hu-ease);
        }
        .hu-addr:hover { border-color: rgba(15, 123, 99, .3); box-shadow: var(--hu-shadow); transform: translateY(-2px); }
        .hu-addr.is-default { border-color: rgba(15, 123, 99, .42); background: linear-gradient(180deg, var(--hu-accent-soft) 0%, var(--hu-surface) 62%); }
        .hu-addr__icon {
            width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0; display: grid; place-items: center;
            font-size: 17px; background: var(--hu-surface-alt); color: var(--hu-muted); border: 1px solid var(--hu-line);
        }
        .hu-addr.is-default .hu-addr__icon { background: var(--hu-grad-accent); color: #fff; border-color: transparent; }
        .hu-addr__main { flex: 1 1 260px; min-width: 0; }
        .hu-addr__top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .hu-addr__name { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; color: var(--hu-ink); }
        .hu-addr__phone { font-size: 13.5px; color: var(--hu-muted); font-variant-numeric: tabular-nums; }
        .hu-addr__text { margin: 8px 0 0; font-size: 14px; line-height: 1.8; color: var(--hu-ink-soft); overflow-wrap: anywhere; }
        .hu-addr__foot { margin: 10px 0 0; font-size: 12px; color: var(--hu-muted); letter-spacing: .02em; }
        .hu-addr__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }

        /* 省 / 市 / 区一行三栏：auto-fit 自然折叠，无需额外断点 */
        .hu-addr3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .hu-span-all { grid-column: 1 / -1; }

        /* 标签 chips */
        .hu-tagpick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        /* 遮罩与卡片样式已上收到 theme.css（.hu-mask / .hu-dialog），此处只留本页专属 */
        .hu-dialog__note { font-size: 13px; color: var(--hu-muted); line-height: 1.8; margin: 0; }

        .hu-addr-tip { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; color: var(--hu-muted); line-height: 1.8; margin-top: 22px; }
        .hu-addr-tip i { color: var(--hu-accent); margin-top: 3px; }
    </style>
</head>
<body class="hu-body">
<div th:replace="~{common/header :: header}"></div>

<div class="hu-pagehead">
    <div class="hu-container hu-pagehead__row">
        <div>
            <div class="hu-crumb"><a href="/index">首页</a> / <a href="/user/profile">个人中心</a> / <span>收货地址</span></div>
            <h1>收货地址</h1>
            <p class="hu-pagehead__sub">维护常用配送地址，结算时一键选择，默认地址优先展示</p>
        </div>
        <div class="hu-pagehead__aside">
            <span class="hu-muted" style="font-size:13px">已存地址</span>
            <div class="hu-num" id="addrHero" style="font-size:26px">—</div>
        </div>
    </div>
</div>

<div class="hu-container">
    <div class="hu-account">
        <!-- 左侧账户栏 -->
        <aside th:replace="~{common/account-nav :: accountNav('addresses')}"></aside>

        <!-- 右侧内容 -->
        <div>
            <div class="hu-panel">
                <div class="hu-panel-head">
                    <div>
                        <h2>地址列表</h2>
                        <p>最多建议保留 1 个默认地址，用于下单时自动填充</p>
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                        <span class="hu-pill hu-pill--muted" id="addrCount">加载中</span>
                        <button type="button" class="hu-btn hu-btn--plain hu-btn--sm" id="btnBatchToggle" style="display:none"><i class="fa fa-check-square-o"></i>批量管理</button>
                        <button type="button" class="hu-btn hu-btn--solid hu-btn--sm" id="btnNewAddr"><i class="fa fa-plus"></i>新增地址</button>
                    </div>
                </div>
                <div class="hu-panel__body">
                    <!-- D08 批量操作条：进入批量管理后浮现，支持全选与批量删除 -->
                    <div id="batchBar" class="hu-batchbar" style="display:none">
                        <label class="hu-check"><input type="checkbox" id="batchAll"> 全选</label>
                        <span class="hu-muted" style="font-size:13px" id="batchSelInfo">已选 0 个</span>
                        <div style="margin-left:auto;display:flex;gap:8px">
                            <button type="button" class="hu-btn hu-btn--plain hu-btn--sm" id="btnBatchCancel">退出</button>
                            <button type="button" class="hu-btn hu-btn--sm" id="btnBatchDelete" disabled style="background:var(--hu-clay);color:#fff;box-shadow:none"><i class="fa fa-trash-o"></i>删除所选</button>
                        </div>
                    </div>
                    <!-- 加载骨架 -->
                    <div id="addrSkeleton" class="hu-addr-list">
                        <div class="hu-addr" style="box-shadow:none">
                            <div class="hu-skeleton" style="width:44px;height:44px;border-radius:13px;flex-shrink:0"></div>
                            <div style="flex:1;min-width:200px">
                                <div class="hu-skeleton hu-skeleton--line w40"></div>
                                <div class="hu-skeleton hu-skeleton--line"></div>
                                <div class="hu-skeleton hu-skeleton--line w60"></div>
                            </div>
                        </div>
                        <div class="hu-addr" style="box-shadow:none">
                            <div class="hu-skeleton" style="width:44px;height:44px;border-radius:13px;flex-shrink:0"></div>
                            <div style="flex:1;min-width:200px">
                                <div class="hu-skeleton hu-skeleton--line w60"></div>
                                <div class="hu-skeleton hu-skeleton--line"></div>
                                <div class="hu-skeleton hu-skeleton--line w40"></div>
                            </div>
                        </div>
                    </div>

                    <div id="addrList" class="hu-addr-list" style="display:none"></div>

                    <div id="addrEmpty" class="hu-empty" style="display:none">
                        <i class="fa fa-map-marker"></i>
                        <strong>还没有收货地址</strong>
                        <span style="font-size:14px">添加一个常用地址，结算时不用再重复填写</span>
                        <button type="button" class="hu-btn hu-btn--solid hu-btn--sm" id="btnEmptyAdd" style="margin-top:18px">
                            <i class="fa fa-plus"></i>新增第一个地址
                        </button>
                    </div>

                    <div class="hu-addr-tip">
                        <i class="fa fa-info-circle"></i>
                        <span>修改与删除仅对本账号生效；已生成的订单沿用下单时的地址快照，不受影响。</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新增 / 编辑地址弹层 -->
<div class="hu-mask" id="addrMask">
    <div class="hu-panel hu-dialog" role="dialog" aria-modal="true" aria-labelledby="addrDialogTitle">
        <div class="hu-panel-head">
            <div>
                <h2 id="addrDialogTitle">新增地址</h2>
                <p id="addrDialogSub">填写收货人信息，带 * 为必填</p>
            </div>
            <button type="button" class="hu-icon-btn" id="addrClose" title="关闭"><i class="fa fa-times"></i></button>
        </div>
        <div class="hu-panel__body">
            <form id="addrForm" novalidate>
                <!-- D10 智能识别：粘贴快递单式的一段文本，一键拆出姓名/电话/省市区/详址后回填，仍可手工核对修改 -->
                <div class="hu-field hu-span-all hu-parse">
                    <label for="parseText"><i class="fa fa-magic"></i> 智能识别<span class="hu-parse__hint">粘贴「姓名 手机号 省市区详细地址」整段文本，自动拆分</span></label>
                    <textarea id="parseText" class="hu-textarea" rows="2" placeholder="例：张三 13800138000 广东省深圳市南山区科技园南路1号3栋501"></textarea>
                    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                        <button type="button" class="hu-btn hu-btn--ghost hu-btn--sm" id="btnParse"><i class="fa fa-magic"></i>识别并填充</button>
                        <span class="hu-parse__result" id="parseResult"></span>
                    </div>
                </div>

                <div class="hu-form-grid">
                    <div class="hu-field">
                        <label for="receiverName">收货人<span class="hu-field__req">*</span></label>
                        <input type="text" id="receiverName" class="hu-input" placeholder="请输入收货人姓名" maxlength="50" autocomplete="name">
                        <div class="hu-field__err"></div>
                    </div>
                    <div class="hu-field">
                        <label for="receiverPhone">手机号<span class="hu-field__req">*</span></label>
                        <input type="tel" id="receiverPhone" class="hu-input" placeholder="11 位手机号" maxlength="11" autocomplete="tel">
                        <div class="hu-field__err"></div>
                    </div>
                    <div class="hu-field hu-span-all">
                        <label>所在地区</label>
                        <div class="hu-addr3">
                            <input type="text" id="province" class="hu-input" placeholder="省 / 直辖市" maxlength="50">
                            <input type="text" id="city" class="hu-input" placeholder="市" maxlength="50">
                            <input type="text" id="district" class="hu-input" placeholder="区 / 县" maxlength="50">
                        </div>
                        <div class="hu-field__err" id="regionErr"></div>
                    </div>
                    <div class="hu-field hu-span-all">
                        <label for="detail">详细地址<span class="hu-field__req">*</span></label>
                        <textarea id="detail" class="hu-textarea" placeholder="街道、门牌号、楼层房间号等" maxlength="255"></textarea>
                        <div class="hu-field__err"></div>
                    </div>
                    <div class="hu-field hu-span-all">
                        <label for="tag">地址标签</label>
                        <input type="text" id="tag" class="hu-input" placeholder="如 家 / 公司 / 学校" maxlength="20">
                        <div class="hu-tagpick" style="margin-top:10px">
                            <div class="hu-chips">
                                <button type="button" class="hu-chip hu-chip--ghost" data-tag="家">家</button>
                                <button type="button" class="hu-chip hu-chip--ghost" data-tag="公司">公司</button>
                                <button type="button" class="hu-chip hu-chip--ghost" data-tag="学校">学校</button>
                            </div>
                        </div>
                        <div class="hu-field__err"></div>
                    </div>
                    <div class="hu-span-all">
                        <label class="hu-check">
                            <input type="checkbox" id="isDefault">
                            <span>设为默认地址</span>
                        </label>
                    </div>
                </div>

                <div class="hu-form-actions">
                    <button type="button" class="hu-btn hu-btn--plain" id="addrCancel">取消</button>
                    <button type="submit" class="hu-btn hu-btn--solid" id="addrSave"><i class="fa fa-check"></i>保存地址</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 删除确认弹层 -->
<div class="hu-mask" id="confirmMask">
    <div class="hu-panel hu-dialog hu-dialog--sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="hu-panel-head">
            <div>
                <h2 id="confirmTitle">删除地址</h2>
                <p>此操作不可撤销</p>
            </div>
            <button type="button" class="hu-icon-btn" id="confirmClose" title="关闭"><i class="fa fa-times"></i></button>
        </div>
        <div class="hu-panel__body">
            <p class="hu-dialog__note" id="confirmText">确认删除该收货地址？</p>
            <div class="hu-form-actions">
                <button type="button" class="hu-btn hu-btn--plain" id="confirmCancel">取消</button>
                <button type="button" class="hu-btn hu-btn--solid" id="confirmOk" style="background:var(--hu-clay);box-shadow:none">确认删除</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{common/footer :: footer}"></div>

<script th:inline="javascript">
    var ADDRESS_API = '/api/addresses';
    var ME_NAME = /*[[${loginUser?.fullName ?: ''}]]*/ '';

    var addresses = [];
    var editingId = null;
    var pendingDelete = null;
    var pendingBatch = null;
    var MAX_ADDR = 20;
    var batchMode = false;
    var selected = {};

    /** 用户输入一律转义后再拼接 HTML */
    function esc(value) {
        return $('<i>').text(value == null ? '' : String(value)).html();
    }

    function fmtTime(value) {
        return value ? String(value).replace('T', ' ').slice(0, 16) : '—';
    }

    /** 字段级错误：与服务端 @Valid 规则一一对应 */
    function setErr($field, message) {
        var $wrap = $field.closest('.hu-field');
        $wrap.toggleClass('has-err', !!message);
        $wrap.find('.hu-field__err').first().text(message || '');
        return !message;
    }

    function clearErrors() {
        $('#addrForm').find('.hu-field').removeClass('has-err').end().find('.hu-field__err').text('');
    }

    function renderSkeleton() {
        $('#addrSkeleton').show();
        $('#addrList').hide().empty();
        $('#addrEmpty').hide();
        $('#addrCount').text('加载中');
    }

    function tagIcon(a) {
        if (a.isDefault === true) return 'fa-home';
        return {'公司': 'fa-briefcase', '学校': 'fa-graduation-cap'}[a.tag] || 'fa-map-marker';
    }

    function renderList() {
        addresses = addresses || [];
        $('#addrHero').text(addresses.length);
        // D09：带上限展示，逼近上限时给出剩余名额提示
        var remain = MAX_ADDR - addresses.length;
        $('#addrCount').text(addresses.length
            ? '共 ' + addresses.length + ' 个 / 上限 ' + MAX_ADDR + (remain <= 0 ? '（已达上限）' : '，还可添加 ' + remain))
            : '暂无地址');
        $('#addrSkeleton').hide();

        if (!addresses.length) {
            batchMode = false;
            $('#batchBar').hide();
            $('#btnBatchToggle').hide();
            $('#addrList').hide().empty();
            $('#addrEmpty').show();
            return;
        }
        $('#addrEmpty').hide();
        $('#btnBatchToggle').show();

        var html = '';
        addresses.forEach(function (a) {
            var isDefault = a.isDefault === true;
            var checked = selected[a.id] ? ' checked' : '';
            html += '<div class="hu-addr' + (isDefault ? ' is-default' : '') + '" data-id="' + esc(a.id) + '">' +
                (batchMode ? '<label class="hu-addr__check"><input type="checkbox" data-check="' + esc(a.id) + '"' + checked + '></label>' : '') +
                '<div class="hu-addr__icon"><i class="fa ' + tagIcon(a) + '"></i></div>' +
                '<div class="hu-addr__main">' +
                '<div class="hu-addr__top">' +
                '<span class="hu-addr__name">' + esc(a.receiverName) + '</span>' +
                '<span class="hu-addr__phone">' + esc(a.receiverPhone) + '</span>' +
                (a.tag ? '<span class="hu-pill hu-pill--muted">' + esc(a.tag) + '</span>' : '') +
                (isDefault ? '<span class="hu-pill hu-pill--ok"><i class="fa fa-check"></i>默认</span>' : '') +
                '</div>' +
                '<p class="hu-addr__text">' + esc(a.fullAddress || a.detail) + '</p>' +
                '<div class="hu-addr__foot">创建于 ' + fmtTime(a.createdAt) + '</div>' +
                '</div>' +
                '<div class="hu-addr__actions">' +
                (isDefault ? '' : '<button type="button" class="hu-btn hu-btn--ghost hu-btn--sm" data-default="' + esc(a.id) + '">设为默认</button>') +
                '<button type="button" class="hu-btn hu-btn--ghost hu-btn--sm" data-edit="' + esc(a.id) + '"><i class="fa fa-pencil"></i>编辑</button>' +
                '<button type="button" class="hu-chip hu-chip--ghost" data-del="' + esc(a.id) + '"><i class="fa fa-trash-o"></i> 删除</button>' +
                '</div></div>';
        });
        $('#addrList').html(html).show();
        syncBatchBar();
    }

    function loadAddresses() {
        renderSkeleton();
        huApi({
            url: ADDRESS_API,
            ok: function (data, res) {
                if (res && res.max) MAX_ADDR = res.max;
                addresses = data || [];
                renderList();
            },
            fail: function () {
                $('#addrSkeleton').hide();
                $('#addrCount').text('加载失败');
                $('#addrList').html('<div class="hu-empty"><i class="fa fa-exclamation-circle"></i><strong>地址加载失败</strong>' +
                    '<span style="font-size:14px">请稍后重试</span></div>').show();
            }
        });
    }

    /* ---------- 弹层开关 ---------- */
    var openCount = 0;

    function openMask($mask) {
        if (!$mask.hasClass('is-open')) openCount++;
        $mask.addClass('is-open');
        $('body').css('overflow', 'hidden');
    }

    function closeMask($mask) {
        if ($mask.hasClass('is-open')) openCount = Math.max(0, openCount - 1);
        $mask.removeClass('is-open');
        if (!openCount) $('body').css('overflow', '');
    }

    function openAddrModal(address) {
        editingId = address ? address.id : null;
        clearErrors();
        $('#addrDialogTitle').text(address ? '编辑地址' : '新增地址');
        $('#addrDialogSub').text(address ? '更新收货信息后点击保存即可生效' : '填写收货人信息，带 * 为必填');
        $('#receiverName').val(address ? address.receiverName : '');
        $('#receiverPhone').val(address ? address.receiverPhone : '');
        $('#province').val(address ? (address.province || '') : '');
        $('#city').val(address ? (address.city || '') : '');
        $('#district').val(address ? (address.district || '') : '');
        $('#detail').val(address ? address.detail : '');
        $('#tag').val(address ? (address.tag || '') : '');
        $('#isDefault').prop('checked', address ? address.isDefault === true : !addresses.length);
        // 每次打开都清空识别框，避免上一次的粘贴残留
        $('#parseText').val('');
        $('#parseResult').text('');
        syncTagChips();
        openMask($('#addrMask'));
        setTimeout(function () { $('#receiverName').trigger('focus'); }, 120);
    }

    function closeAddrModal() {
        closeMask($('#addrMask'));
        editingId = null;
    }

    function openConfirm(address) {
        pendingDelete = address;
        $('#confirmTitle').text('删除地址');
        $('#confirmText').text('确认删除「' + (address.receiverName || '') + '　' + (address.fullAddress || address.detail || '') + '」？删除后不可恢复。');
        openMask($('#confirmMask'));
    }

    function closeConfirm() {
        closeMask($('#confirmMask'));
        pendingDelete = null;
    }

    function syncTagChips() {
        var v = $.trim($('#tag').val());
        $('[data-tag]').each(function () {
            $(this).toggleClass('is-active', v === String($(this).data('tag')));
        });
    }

    /* ---------- 校验：与 UserDtos.AddressForm 保持一致 ---------- */
    function validateForm() {
        var ok = true;
        var name = $.trim($('#receiverName').val());
        ok = setErr($('#receiverName'), !name ? '请填写收货人' : (name.length > 50 ? '收货人不能超过 50 个字符' : '')) && ok;
        var phone = $.trim($('#receiverPhone').val());
        ok = setErr($('#receiverPhone'), !phone ? '请填写手机号' : (/^1[3-9]\d{9}$/.test(phone) ? '' : '手机号格式不正确')) && ok;
        var detail = $.trim($('#detail').val());
        ok = setErr($('#detail'), !detail ? '请填写详细地址' : (detail.length > 255 ? '详细地址不能超过 255 个字符' : '')) && ok;
        var tag = $.trim($('#tag').val());
        ok = setErr($('#tag'), tag.length > 20 ? '标签不能超过 20 个字符' : '') && ok;
        var regionErr = '';
        ['#province', '#city', '#district'].forEach(function (sel) {
            if ($(sel).val().length > 50) regionErr = '省 / 市 / 区每一项均不能超过 50 个字符';
        });
        setErr($('#province'), regionErr);
        return ok;
    }

    function buildPayload() {
        return {
            receiverName: $.trim($('#receiverName').val()),
            receiverPhone: $.trim($('#receiverPhone').val()),
            province: $.trim($('#province').val()),
            city: $.trim($('#city').val()),
            district: $.trim($('#district').val()),
            detail: $.trim($('#detail').val()),
            tag: $.trim($('#tag').val()),
            isDefault: $('#isDefault').is(':checked')
        };
    }

    /* ---------- D08 批量管理 ---------- */
    function selectedIds() {
        return Object.keys(selected).filter(function (k) { return selected[k]; });
    }

    function syncBatchBar() {
        var n = selectedIds().length;
        $('#batchSelInfo').text('已选 ' + n + ' 个');
        $('#btnBatchDelete').prop('disabled', n === 0);
        var all = addresses.length > 0 && n === addresses.length;
        $('#batchAll').prop('checked', all);
    }

    function enterBatch() {
        batchMode = true;
        selected = {};
        $('#batchBar').show();
        $('#btnBatchToggle').html('<i class="fa fa-times"></i>退出批量');
        renderList();
    }

    function exitBatch() {
        batchMode = false;
        selected = {};
        $('#batchBar').hide();
        $('#btnBatchToggle').html('<i class="fa fa-check-square-o"></i>批量管理');
        renderList();
    }

    function openBatchConfirm() {
        var ids = selectedIds();
        if (!ids.length) return;
        pendingBatch = ids;
        $('#confirmTitle').text('批量删除地址');
        $('#confirmText').text('确认删除选中的 ' + ids.length + ' 个收货地址？删除后不可恢复。');
        openMask($('#confirmMask'));
    }

    /* ---------- D10 智能识别 ---------- */
    function runParse() {
        var text = $.trim($('#parseText').val());
        if (!text) {
            $('#parseResult').text('请先粘贴要识别的文本');
            return;
        }
        var $btn = $('#btnParse').prop('disabled', true);
        $('#parseResult').text('识别中…');
        huApi({
            url: ADDRESS_API + '/parse',
            type: 'POST',
            data: {raw: text},
            ok: function (data) {
                $btn.prop('disabled', false);
                if (!data) { $('#parseResult').text('未能识别，请手动填写'); return; }
                // 只回填识别出的字段，不覆盖用户已手填的值（留空的才填）
                [['receiverName', data.receiverName], ['receiverPhone', data.receiverPhone],
                    ['province', data.province], ['city', data.city], ['district', data.district],
                    ['detail', data.detail]].forEach(function (pair) {
                    var $el = $('#' + pair[0]);
                    if (pair[1] && !$el.val()) $el.val(pair[1]);
                });
                clearErrors();
                var n = data.filledCount != null ? data.filledCount : 0;
                $('#parseResult').html('<i class="fa fa-check" style="color:var(--hu-accent)"></i> 识别到 ' + n + ' 项，请核对后保存');
            },
            fail: function () { $btn.prop('disabled', false); $('#parseResult').text('识别失败，请手动填写'); }
        });
    }

    $(document).ready(function () {
        loadAddresses();

        $('#btnNewAddr, #btnEmptyAdd').on('click', function () { openAddrModal(null); });
        $('#addrClose, #addrCancel').on('click', closeAddrModal);
        $('#confirmClose, #confirmCancel').on('click', function () { closeConfirm(); pendingBatch = null; });

        /* 遮罩点击与 ESC 关闭 */
        $('#addrMask').on('mousedown', function (e) { if (e.target === this) closeAddrModal(); });
        $('#confirmMask').on('mousedown', function (e) { if (e.target === this) { closeConfirm(); pendingBatch = null; } });
        $(document).on('keydown', function (e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                if ($('#confirmMask').hasClass('is-open')) closeConfirm();
                else if ($('#addrMask').hasClass('is-open')) closeAddrModal();
            }
        });

        $('#tag').on('input', syncTagChips);
        $('[data-tag]').on('click', function () {
            var v = String($(this).data('tag'));
            $('#tag').val($.trim($('#tag').val()) === v ? '' : v).trigger('input');
        });

        /* D08 批量管理 */
        $('#btnBatchToggle').on('click', function () { batchMode ? exitBatch() : enterBatch(); });
        $('#btnBatchCancel').on('click', exitBatch);
        $('#btnBatchDelete').on('click', openBatchConfirm);
        $('#batchAll').on('change', function () {
            var on = $(this).is(':checked');
            selected = {};
            if (on) addresses.forEach(function (a) { selected[a.id] = true; });
            renderList();
        });
        $('#addrList').on('change', '[data-check]', function () {
            var id = String($(this).data('check'));
            selected[id] = $(this).is(':checked');
            syncBatchBar();
        });

        /* D10 智能识别 */
        $('#btnParse').on('click', runParse);

        $('#addrForm').submit(function (e) {
            e.preventDefault();
            if (!validateForm()) return;
            var $btn = $('#addrSave').prop('disabled', true);
            huApi({
                url: editingId ? ADDRESS_API + '/' + editingId : ADDRESS_API,
                type: editingId ? 'PUT' : 'POST',
                data: buildPayload(),
                ok: function (data, res) {
                    closeAddrModal();
                    window.huToast(res.msg || '地址已保存', 'ok');
                    loadAddresses();
                },
                always: function () { $btn.prop('disabled', false); }
            });
        });

        $('#addrList').on('click', '[data-edit]', function () {
            var id = String($(this).data('edit'));
            openAddrModal(addresses.filter(function (a) { return String(a.id) === id; })[0]);
        });

        $('#addrList').on('click', '[data-default]', function () {
            var id = String($(this).data('default'));
            var $btn = $(this).prop('disabled', true);
            huApi({
                url: ADDRESS_API + '/' + id + '/default',
                type: 'PATCH',
                ok: function (data, res) {
                    window.huToast(res.msg || '已设为默认地址', 'ok');
                    loadAddresses();
                },
                fail: function () { $btn.prop('disabled', false); }
            });
        });

        $('#addrList').on('click', '[data-del]', function () {
            var id = String($(this).data('del'));
            var found = addresses.filter(function (a) { return String(a.id) === id; })[0];
            if (found) { pendingBatch = null; openConfirm(found); }
        });

        /* 单个与批量共用确认弹层：pendingBatch 非空即批量分支 */
        $('#confirmOk').on('click', function () {
            var $btn = $(this).prop('disabled', true);
            if (pendingBatch && pendingBatch.length) {
                huApi({
                    url: ADDRESS_API + '/batch-delete',
                    type: 'POST',
                    data: {ids: pendingBatch},
                    ok: function (n, res) {
                        closeConfirm();
                        pendingBatch = null;
                        window.huToast(res.msg || '已删除所选地址', 'ok');
                        exitBatch();
                    },
                    always: function () { $btn.prop('disabled', false); }
                });
                return;
            }
            if (!pendingDelete) return;
            var id = String(pendingDelete.id);
            huApi({
                url: ADDRESS_API + '/' + id,
                type: 'DELETE',
                ok: function (data, res) {
                    closeConfirm();
                    window.huToast(res.msg || '地址已删除', 'ok');
                    loadAddresses();
                },
                always: function () { $btn.prop('disabled', false); }
            });
        });
    });
</script>
</body>
</html>
