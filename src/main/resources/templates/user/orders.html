<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/head :: resources}"></th:block>
    <title>我的订单 · 花语轩</title>
</head>
<body class="hu-body">
<div th:replace="~{common/header :: header}"></div>

<div class="hu-pagehead">
    <div class="hu-container hu-pagehead__row">
        <div>
            <div class="hu-crumb"><a href="/index">首页</a> / <a href="/user/profile">个人中心</a> / <span>我的订单</span></div>
            <h1>我的订单</h1>
            <p class="hu-pagehead__sub">每一次交付都可追溯，售后与评价都在这里</p>
        </div>
        <div class="hu-pagehead__aside">
            <span class="hu-muted" style="font-size:13px">符合条件的订单</span>
            <span class="hu-num" id="orderTotal" style="font-size:26px">—</span>
        </div>
    </div>
</div>

<div class="hu-container">
    <div class="hu-account">
        <aside th:replace="~{common/account-nav :: accountNav('orders')}"></aside>

        <div>
            <div class="hu-panel">
                <div class="hu-panel-head">
                    <div>
                        <h2>订单列表</h2>
                        <p id="listSub">待付款订单超时未支付将自动取消并回补库存</p>
                    </div>
                    <span class="hu-pill hu-pill--muted" id="filterLabel">全部</span>
                </div>
                <div class="hu-panel__body">
                    <!-- C01/C02/C03：状态分组 + 下单时间范围 + 关键词 + 排序，条件全部交给服务端一次查完 -->
                    <div class="hu-chips" id="statusTabs" style="margin-bottom:18px">
                        <button type="button" class="hu-chip is-active" data-status="all">全部</button>
                        <button type="button" class="hu-chip" data-status="pending">待付款</button>
                        <button type="button" class="hu-chip" data-status="toship">待发货</button>
                        <button type="button" class="hu-chip" data-status="shipping">配送中</button>
                        <button type="button" class="hu-chip" data-status="done">已完成</button>
                        <button type="button" class="hu-chip" data-status="closed">已取消/退款</button>
                    </div>

                    <div class="hu-c-filter">
                        <div class="hu-c-filter__field hu-c-filter__field--kw">
                            <label for="kw">搜索</label>
                            <input class="hu-input" id="kw" type="search" maxlength="40"
                                   placeholder="订单号 / 收货人 / 手机号">
                        </div>
                        <div class="hu-c-filter__field">
                            <label for="dateFrom">下单开始</label>
                            <input class="hu-input" id="dateFrom" type="date">
                        </div>
                        <div class="hu-c-filter__field">
                            <label for="dateTo">下单结束</label>
                            <input class="hu-input" id="dateTo" type="date">
                        </div>
                        <div class="hu-c-filter__field">
                            <label for="sortBy">排序</label>
                            <select class="hu-select" id="sortBy">
                                <option value="time_desc">最近下单</option>
                                <option value="time_asc">最早下单</option>
                                <option value="amount_desc">金额从高到低</option>
                                <option value="amount_asc">金额从低到高</option>
                            </select>
                        </div>
                        <div class="hu-c-filter__submit">
                            <button type="button" class="hu-btn hu-btn--solid hu-btn--sm" id="doFilter">
                                <i class="fa fa-search"></i>&nbsp;查询
                            </button>
                            <button type="button" class="hu-btn hu-btn--plain hu-btn--sm" id="resetFilter">重置</button>
                        </div>
                    </div>

                    <p class="hu-c-listhint" id="filterHint"></p>

                    <div id="orderList"></div>

                    <div id="orderEmpty" class="hu-empty" style="display:none">
                        <i class="fa fa-file-text-o"></i>
                        <strong>暂无相关订单</strong>
                        <span style="font-size:14px">换个状态或时间范围再试试，或者挑一束合心意的花</span>
                        <a href="/products" class="hu-btn hu-btn--solid hu-btn--sm" style="margin-top:18px">去选购花礼</a>
                    </div>

                    <div id="orderPager" class="hu-pager" style="margin-top:24px"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 取消订单的二次确认弹窗（C06/C07）：原因必选一项或填写说明，落库后在详情页与后台显示 -->
<div class="hu-c-mask" id="cMask">
    <div class="hu-c-dialog" role="dialog" aria-modal="true" aria-labelledby="cDlgTitle">
        <div class="hu-c-dialog__head">
            <div>
                <h3 id="cDlgTitle">确认取消这笔订单？</h3>
                <p id="cDlgSub">取消后占用的库存、优惠券与积分将立即回退，本单不可恢复。</p>
            </div>
            <button type="button" class="hu-c-dialog__close" data-close aria-label="关闭">&times;</button>
        </div>
        <div class="hu-c-dialog__body">
            <div class="hu-c-field">
                <div class="hu-c-field__label"><span>取消原因</span><span class="hu-c-field__hint">也可只写补充说明</span></div>
                <div class="hu-c-reasons" id="cDlgReasons"></div>
            </div>
            <div class="hu-c-field">
                <div class="hu-c-field__label"><label for="cDlgText">补充说明（选填）</label></div>
                <textarea class="hu-textarea" id="cDlgText" rows="3" maxlength="120"
                          placeholder="例如：临时改行程，这周不需要了"></textarea>
            </div>
        </div>
        <div class="hu-c-dialog__foot">
            <button type="button" class="hu-btn hu-btn--ghost hu-btn--sm" data-close>返回</button>
            <button type="button" class="hu-btn hu-btn--solid hu-btn--sm" id="cDlgOk">确认取消</button>
        </div>
    </div>
</div>

<div th:replace="~{common/footer :: footer}"></div>

<script th:inline="javascript">
    const PLACEHOLDER = /*[[@{/img/product-placeholder.svg}]]*/ '/img/product-placeholder.svg';
    const PAGE_SIZE = 5;
    let status = 'all';
    let page = 1;
    let total = 0;
    let cancelling = null;
    let tick = null;

    const STATUS_PILL = {
        pending: 'hu-pill--warn',
        paid: 'hu-pill--ok',
        processing: 'hu-pill--ok',
        shipped: 'hu-pill--ok',
        delivered: 'hu-pill--ok',
        completed: 'hu-pill--ok',
        cancelled: 'hu-pill--muted',
        refunded: 'hu-pill--muted'
    };

    function esc(s) {
        return $('<i>').text(s == null ? '' : String(s)).html();
    }

    function money(v) {
        return Number(v || 0).toFixed(2).replace(/\.00$/, '');
    }

    function time(v) {
        return v ? String(v).replace('T', ' ').slice(0, 16) : '-';
    }

    function mmss(sec) {
        const s = Math.max(Number(sec || 0), 0);
        const pad = function (n) { return (n < 10 ? '0' : '') + n; };
        return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    }

    function renderSkeletons() {
        let html = '';
        for (let i = 0; i < 2; i++) {
            html += '<div class="hu-ordercard"><div class="hu-ordercard__head">' +
                '<div class="hu-skeleton hu-skeleton--line" style="width:220px;margin:0"></div></div>' +
                '<div class="hu-ordercard__body">' +
                '<div class="hu-skeleton hu-skeleton--line" style="width:60%"></div>' +
                '<div class="hu-skeleton hu-skeleton--line" style="width:40%;margin-top:14px"></div>' +
                '</div></div>';
        }
        $('#orderList').html(html);
    }

    function itemRow(item) {
        // 行备注与包装标记是下单当时的快照（B01/B02），列表里也要能一眼看到
        const note = item.itemNote
            ? '<div class="hu-c-note"><i class="fa fa-pencil"></i><span>' + esc(item.itemNote) + '</span></div>' : '';
        const wrap = item.giftWrap ? '<span class="hu-c-tag"><i class="fa fa-gift"></i> 礼品包装</span>' : '';
        return '<div class="hu-ordercard__item">' +
            '<img src="' + esc(item.productImage || PLACEHOLDER) + '" alt="" ' +
            'onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'">' +
            '<div><a class="hu-ordercard__name" href="/product/' + esc(item.productId) + '">' + esc(item.productName) + '</a>' +
            '<div class="hu-ordercard__sub">' + (item.reviewed ? '已评价 · 感谢反馈' : '未评价') + wrap + '</div>' + note + '</div>' +
            '<div class="hu-muted" style="font-size:13px">× ' + esc(item.quantity) + '</div>' +
            '<div style="text-align:right;font-size:14px;font-variant-numeric:tabular-nums">¥' +
            money(item.subtotal != null ? item.subtotal : item.price) + '</div>' +
            '</div>';
    }

    function actions(o) {
        let html = '';
        if (o.canPay) {
            html += '<button class="hu-btn hu-btn--solid hu-btn--sm" data-act="pay" data-id="' + esc(o.id) + '">' +
                '<i class="fa fa-credit-card"></i>立即支付</button>';
        }
        if (o.canConfirmReceipt) {
            html += '<button class="hu-btn hu-btn--accent hu-btn--sm" data-act="receipt" data-id="' + esc(o.id) + '">' +
                '<i class="fa fa-check"></i>确认收货</button>';
        }
        if (o.canCancel) {
            html += '<button class="hu-btn hu-btn--ghost hu-btn--sm" data-act="cancel" data-id="' + esc(o.id) + '">取消订单</button>';
        }
        if (o.canReview) {
            html += '<a class="hu-btn hu-btn--ghost hu-btn--sm" href="/order/' + esc(o.id) + '#review">写评价</a>';
        }
        // 退款要选原因并看进度，统一进详情页操作，列表不铺开第二套表单
        if (o.canApplyRefund) {
            html += '<a class="hu-btn hu-btn--plain hu-btn--sm" href="/order/' + esc(o.id) + '">申请退款</a>';
        }
        html += '<button class="hu-btn hu-btn--plain hu-btn--sm" data-act="reorder" data-id="' + esc(o.id) + '">' +
            '<i class="fa fa-repeat"></i>再次购买</button>';
        html += '<a class="hu-btn hu-btn--plain hu-btn--sm" href="/order/' + esc(o.id) + '">查看详情</a>';
        return html;
    }

    /** 卡片顶部的一条状态提示：待付款倒计时（C08）与售后进度、评价引导（C26） */
    function cardAlert(o) {
        if (o.status === 'pending' && o.paySecondsLeft != null) {
            const danger = Number(o.paySecondsLeft) <= Number(o.payWarnSeconds || 0);
            return '<div class="hu-c-alert ' + (danger ? 'hu-c-alert--danger' : 'hu-c-alert--warn') + '" style="margin:0 0 14px">' +
                '<i class="fa fa-clock-o"></i><div class="hu-c-alert__main">剩 <span class="hu-c-count" ' +
                'data-countdown="' + o.id + '" data-seconds="' + o.paySecondsLeft + '">' + mmss(o.paySecondsLeft)
                + '</span> 自动关单，超时后库存与优惠将回退</div></div>';
        }
        if (o.refund) {
            return '<div class="hu-c-alert ' + (o.refund.status === 'refunded' ? 'hu-c-alert--ok' : 'hu-c-alert--warn') +
                '" style="margin:0 0 14px"><i class="fa fa-undo"></i><div class="hu-c-alert__main">退款进度：'
                + esc(o.refund.statusLabel || o.refund.status) + ' ¥' + money(o.refund.amount) + '　'
                + esc(o.refund.hint || '') + '</div></div>';
        }
        if (o.reviewGuide) {
            return '<div class="hu-c-alert hu-c-alert--ok" style="margin:0 0 14px"><i class="fa fa-star"></i>' +
                '<div class="hu-c-alert__main">' + esc(o.reviewGuide) + '</div>' +
                '<div class="hu-c-alert__act"><a class="hu-btn hu-btn--accent hu-btn--sm" href="/order/'
                + esc(o.id) + '#review">去评价</a></div></div>';
        }
        if (o.cancelReason && (o.status === 'cancelled' || o.status === 'refunded')) {
            return '<div class="hu-c-alert" style="margin:0 0 14px"><i class="fa fa-info-circle"></i>' +
                '<div class="hu-c-alert__main">' + (o.status === 'cancelled' ? '取消原因' : '退款原因') + '：'
                + esc(o.cancelReason) + '</div></div>';
        }
        return '';
    }

    function card(o) {
        const items = o.items || [];
        const shown = items.slice(0, 2).map(itemRow).join('');
        const more = items.length > 2
            ? '<div class="hu-ordercard__more">共 ' + items.length + ' 件商品，完整清单请进入订单详情</div>' : '';
        return '<div class="hu-ordercard">' +
            '<div class="hu-ordercard__head">' +
            '<span class="hu-ordercard__no">订单号 ' + esc(o.orderNo) + '</span>' +
            '<span>下单 ' + time(o.createdAt) + '</span>' +
            '<span class="hu-pill ' + (STATUS_PILL[o.status] || 'hu-pill--muted') + '">' +
            esc(o.statusLabel || o.status) + '</span></div>' +
            '<div class="hu-ordercard__body">' + cardAlert(o)
            + (shown || '<div class="hu-ordercard__sub" style="padding:12px 0">商品明细已不可用</div>') + '</div>' +
            more +
            '<div class="hu-ordercard__foot">' +
            '<span class="hu-ordercard__pay">实付<b>¥' + money(o.payAmount) + '</b></span>' +
            '<span class="hu-ordercard__acts">' + actions(o) + '</span>' +
            '</div></div>';
    }

    function renderPager() {
        const pages = Math.ceil(total / PAGE_SIZE);
        if (pages <= 1) {
            $('#orderPager').html('');
            return;
        }
        let html = '<button ' + (page === 1 ? 'disabled' : 'data-page="' + (page - 1) + '"') + '><i class="fa fa-chevron-left"></i></button>';
        for (let i = 1; i <= pages; i++) {
            html += '<button class="' + (i === page ? 'is-active' : '') + '" data-page="' + i + '">' + i + '</button>';
        }
        html += '<button ' + (page === pages ? 'disabled' : 'data-page="' + (page + 1) + '"') + '><i class="fa fa-chevron-right"></i></button>';
        $('#orderPager').html(html);
    }

    /** 列表里的倒计时共用一个 interval：DOM 上的 data-seconds 每秒自减，归零刷新一次 */
    function startTick() {
        if (tick) clearInterval(tick);
        tick = null;
        if (!$('#orderList [data-countdown]').length) return;
        tick = setInterval(function () {
            let hitZero = false;
            $('#orderList [data-countdown]').each(function () {
                const left = Math.max(Number($(this).attr('data-seconds')) - 1, 0);
                $(this).attr('data-seconds', left).text(mmss(left));
                if (left === 0) hitZero = true;
            });
            if (hitZero) {
                clearInterval(tick);
                tick = null;
                load();
            }
        }, 1000);
    }

    function isoStart(value) {
        return value ? value + 'T00:00:00' : '';
    }

    function isoEnd(value) {
        return value ? value + 'T23:59:59' : '';
    }

    function load() {
        renderSkeletons();
        $('#orderEmpty').hide();
        const params = {page: page, limit: PAGE_SIZE, status: status, sort: $('#sortBy').val()};
        const kw = String($('#kw').val() || '').trim();
        if (kw) params.keyword = kw;
        const from = $('#dateFrom').val();
        const to = $('#dateTo').val();
        if (from) params.from = isoStart(from);
        if (to) params.to = isoEnd(to);
        huApi({
            url: '/api/orders',
            data: params,
            ok: function (data, res) {
                total = Number(res.count || 0);
                const list = data || [];
                window.__orders = list;
                $('#orderTotal').text(total);
                $('#filterLabel').text($('#statusTabs .hu-chip.is-active').text() || '全部');
                $('#filterHint').text(describe(list.length));
                if (!list.length) {
                    $('#orderList').html('');
                    $('#orderEmpty').show();
                    $('#orderPager').html('');
                    return;
                }
                $('#orderList').html(list.map(card).join(''));
                renderPager();
                startTick();
            },
            fail: function () {
                $('#orderList').html('');
                $('#orderEmpty').show();
            }
        });
    }

    /** 条件摘要：把用户真正生效的筛选条件回读一遍，避免"筛了但没生效"被当成 bug */
    function describe(count) {
        const parts = [];
        const tab = $('#statusTabs .hu-chip.is-active').text();
        if (tab && tab !== '全部') parts.push('状态 ' + tab);
        if ($('#kw').val()) parts.push('关键词「' + String($('#kw').val()).trim() + '」');
        if ($('#dateFrom').val() || $('#dateTo').val()) {
            parts.push('下单时间 ' + ($('#dateFrom').val() || '不限') + ' ~ ' + ($('#dateTo').val() || '不限'));
        }
        const sort = $('#sortBy option:selected').text();
        parts.push('排序 ' + sort);
        return '共 ' + count + ' 单 · 当前条件：' + parts.join('　|　');
    }

    function openCancel(o) {
        cancelling = o;
        const reasons = o.cancelReasons || [];
        $('#cDlgReasons').html(reasons.map(function (r) {
            return '<button type="button" class="hu-chip" data-reason="' + esc(r.code) + '">' + esc(r.label) + '</button>';
        }).join(''));
        $('#cDlgText').val('');
        $('#cDlgOk').prop('disabled', false);
        $('#cMask').addClass('is-open');
    }

    function closeDialog() {
        $('#cMask').removeClass('is-open');
        cancelling = null;
    }

    $(document).ready(function () {
        load();

        $('#statusTabs').on('click', '.hu-chip', function () {
            status = String($(this).data('status') || 'all');
            page = 1;
            $(this).addClass('is-active').siblings().removeClass('is-active');
            load();
        });

        $('#doFilter').on('click', function () {
            page = 1;
            load();
        });

        $('#resetFilter').on('click', function () {
            $('#kw, #dateFrom, #dateTo').val('');
            $('#sortBy').val('time_desc');
            status = 'all';
            page = 1;
            $('#statusTabs .hu-chip').removeClass('is-active').first().addClass('is-active');
            load();
        });

        $('#sortBy').on('change', function () {
            page = 1;
            load();
        });

        $('#kw').on('keydown', function (e) {
            if (e.key === 'Enter') {
                page = 1;
                load();
            }
        });

        $('#orderPager').on('click', 'button[data-page]', function () {
            page = Number($(this).data('page'));
            load();
            window.scrollTo({top: 0, behavior: 'smooth'});
        });

        $('#orderList').on('click', '[data-act]', function () {
            const act = $(this).data('act');
            const id = $(this).data('id');
            if (act === 'pay') {
                if (!confirm('确认支付本单？演示环境将直接标记为已支付')) return;
                huApi({
                    url: '/api/orders/' + id + '/pay', type: 'POST',
                    data: {payMethod: 'wechat'},
                    ok: function () { window.huToast('支付成功，花艺师开始为你配花', 'ok'); load(); }
                });
            } else if (act === 'cancel') {
                const order = findOrder(id);
                if (order) openCancel(order);
            } else if (act === 'receipt') {
                if (!confirm('确认已收到花礼？确认后可为本次体验写评价')) return;
                huApi({
                    url: '/api/orders/' + id + '/confirm-receipt', type: 'POST',
                    data: {},
                    ok: function () { window.huToast('已确认收货，感谢你的信任', 'ok'); load(); }
                });
            } else if (act === 'reorder') {
                reorder(id, $(this));
            }
        });

        $('#cMask').on('click', '[data-close]', closeDialog);
        $('#cMask').on('click', '.hu-chip', function () {
            $(this).toggleClass('is-active').siblings().removeClass('is-active');
        });

        $('#cDlgOk').on('click', function () {
            const btn = $(this);
            const code = String($('#cMask .hu-chip.is-active').data('reason') || '');
            const text = String($('#cDlgText').val() || '').trim();
            if (!code && !text) {
                window.huToast('请选择或填写取消原因', 'err');
                return;
            }
            btn.prop('disabled', true);
            huApi({
                url: '/api/orders/' + cancelling.id + '/cancel', type: 'POST',
                data: {reasonCode: code, reasonText: text},
                ok: function () { closeDialog(); window.huToast('订单已取消，库存与优惠已回退', 'ok'); load(); },
                fail: function () { btn.prop('disabled', false); }
            });
        });
    });

    /** 列表数据留在内存里取一次即可，取消弹窗需要该单的预设原因 */
    function findOrder(id) {
        return (window.__orders || []).filter(function (o) { return String(o.id) === String(id); })[0] || null;
    }

    function reorder(orderId, btn) {
        btn.prop('disabled', true);
        huApi({
            url: '/api/cart/reorder/' + orderId, type: 'POST', data: {},
            ok: function (data, res) {
                btn.prop('disabled', false);
                if (res.itemCount != null) $('.hu-cart-count').text(res.itemCount).show();
                showReorder(res);
            },
            fail: function () { btn.prop('disabled', false); }
        });
    }

    /** 再次购买回执（B24）：notice 一句话 + adjusted/skipped 逐条列，用户才知道哪束没加回来 */
    function showReorder(res) {
        window.huToast(res.notice || '已加回购物车', 'ok');
        const adjusted = res.adjusted || [];
        const skipped = res.skipped || [];
        if (!adjusted.length && !skipped.length) return;
        let html = '';
        if (adjusted.length) {
            html += '<div class="hu-c-report"><b>已按库存调整</b><ul>'
                + adjusted.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
        }
        if (skipped.length) {
            html += '<div class="hu-c-report hu-c-report--skip"><b>未能加购</b><ul>'
                + skipped.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
        }
        $('#reorderReport').remove();
        $('#orderList').before('<div id="reorderReport">' + html + '</div>');
    }
</script>
</body>
</html>
