<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/head :: resources}"></th:block>
    <title>个人中心 · 花语轩</title>
    <style>
        .hu-profile__section + .hu-profile__section { margin-top: 30px; padding-top: 30px; border-top: 1px solid var(--hu-line); }
        .hu-profile__hint { font-size: 12px; color: var(--hu-muted); margin-top: 6px; }
        .hu-field__req { color: var(--hu-clay); margin-left: 3px; }
        .hu-profile__meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 28px; margin: 0; }
        .hu-profile__meta dt { font-size: 12px; letter-spacing: .04em; color: var(--hu-muted); }
        .hu-profile__meta dd { margin: 5px 0 0; font-size: 14px; color: var(--hu-ink); font-weight: 500; }
        .hu-form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
        @media (max-width: 720px) { .hu-profile__meta { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="hu-body">
<div th:replace="~{common/header :: header}"></div>

<div class="hu-pagehead">
    <div class="hu-container hu-pagehead__row">
        <div>
            <div class="hu-crumb"><a href="/index">首页</a> / <span>个人中心</span></div>
            <h1>个人中心</h1>
            <p class="hu-pagehead__sub">管理你的账户资料、会员权益与登录安全</p>
        </div>
        <div class="hu-pagehead__aside">
            <span class="hu-muted" style="font-size:13px">账户积分</span>
            <div class="hu-num" id="pointsHero" style="font-size:26px">—</div>
        </div>
    </div>
</div>

<div class="hu-container">
    <div class="hu-account">
        <!-- 左侧账户栏 -->
        <aside>
            <div class="hu-panel hu-idcard">
                <div class="hu-idcard__avatar" id="avatar"><i class="fa fa-user"></i></div>
                <div style="min-width:0">
                    <div class="hu-idcard__name" id="sideName" th:text="${loginUser?.fullName ?: '用户'}">用户名</div>
                    <div class="hu-idcard__meta" id="sidePhone" th:text="${loginUser?.phone}">手机号</div>
                </div>
            </div>
            <div class="hu-panel hu-panel--pad hu-side-sticky">
                <h3 class="hu-side-title">账户导航</h3>
                <ul class="hu-navtabs">
                    <li><a href="/user/profile" class="is-active"><i class="fa fa-user-o"></i>个人资料</a></li>
                    <li><a href="/user/orders"><i class="fa fa-file-text-o"></i>我的订单</a></li>
                    <li><a href="/user/favorites"><i class="fa fa-heart-o"></i>我的收藏</a></li>
                    <li><a href="/user/coupons"><i class="fa fa-ticket"></i>我的优惠券</a></li>
                    <li><a href="/user/addresses"><i class="fa fa-map-marker"></i>收货地址</a></li>
                    <li><a href="/user/settings"><i class="fa fa-cog"></i>账号设置</a></li>
                    <li><a href="/cart"><i class="fa fa-shopping-bag"></i>购物车</a></li>
                    <li><a href="/auth/logout" style="color:var(--hu-clay)"><i class="fa fa-sign-out"></i>退出登录</a></li>
                </ul>
            </div>
        </aside>

        <!-- 右侧内容 -->
        <div>
            <div class="hu-panel">
                <div class="hu-panel-head">
                    <div>
                        <h2>个人资料</h2>
                        <p>用于订单配送与售后联系，请保持真实有效</p>
                    </div>
                    <span class="hu-pill hu-pill--muted" id="metaType">-</span>
                </div>
                <div class="hu-panel__body">
                <div id="pwdTip" class="hu-auth__err" style="display:none">
                    <i class="fa fa-exclamation-triangle"></i>&nbsp;当前密码由管理员重置，建议尽快在下方「账号安全」中修改。
                </div>

                <div id="profileContent" style="display:none">
                    <!-- 会员概览 -->
                    <div class="hu-stat-row">
                        <div class="hu-stat hu-panel"><div class="n" id="memberLevel" style="font-size:22px">-</div><div class="l">会员等级</div></div>
                        <div class="hu-stat hu-panel"><div class="n" id="points">-</div><div class="l">账户积分</div></div>
                        <div class="hu-stat hu-panel"><div class="n" style="font-size:22px" id="status">-</div><div class="l">账户状态</div></div>
                    </div>
                    <p class="hu-profile__hint" style="margin:-12px 0 28px" id="pointsHint"></p>

                    <form id="profileForm" novalidate>
                        <div class="hu-form-grid">
                            <div class="hu-field">
                                <label for="username">用户名</label>
                                <input type="text" id="username" class="hu-input hu-input--readonly" readonly>
                                <div class="hu-profile__hint">登录账号，创建后不可修改</div>
                            </div>
                            <div class="hu-field">
                                <label for="fullName">姓名<span class="hu-field__req">*</span></label>
                                <input type="text" id="fullName" name="fullName" class="hu-input" placeholder="请输入真实姓名" maxlength="100">
                                <div class="hu-field__err"></div>
                            </div>
                            <div class="hu-field">
                                <label for="phone">手机号<span class="hu-field__req">*</span></label>
                                <input type="tel" id="phone" name="phone" class="hu-input" placeholder="11 位手机号" maxlength="11">
                                <div class="hu-field__err"></div>
                            </div>
                            <div class="hu-field">
                                <label for="email">邮箱</label>
                                <input type="email" id="email" name="email" class="hu-input" placeholder="name@example.com" maxlength="100">
                                <div class="hu-field__err"></div>
                            </div>
                            <div class="hu-field">
                                <label for="gender">性别</label>
                                <select id="gender" name="gender" class="hu-select hu-select--block">
                                    <option value="">不设置</option>
                                    <option value="male">男</option>
                                    <option value="female">女</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="hu-field">
                                <label for="birthday">生日</label>
                                <input type="date" id="birthday" name="birthday" class="hu-input">
                                <div class="hu-field__err"></div>
                            </div>
                        </div>

                        <div class="hu-form-actions">
                            <button type="submit" class="hu-btn hu-btn--solid" id="btnSaveProfile"><i class="fa fa-check"></i>保存修改</button>
                        </div>
                    </form>

                    <!-- 账号安全 -->
                    <div class="hu-profile__section">
                        <h3 class="hu-subhead">账号安全</h3>
                        <dl class="hu-profile__meta">
                            <div><dt>注册身份</dt><dd id="metaRole">-</dd></div>
                            <div><dt>注册时间</dt><dd id="metaCreated">-</dd></div>
                            <div><dt>最近登录</dt><dd id="metaLastLogin">-</dd></div>
                            <div><dt>密码状态</dt><dd id="metaPwd">-</dd></div>
                        </dl>

                        <form id="passwordForm" novalidate style="margin-top:26px">
                            <div class="hu-form-grid">
                                <div class="hu-field">
                                    <label for="oldPassword">原密码</label>
                                    <input type="password" id="oldPassword" class="hu-input" placeholder="请输入当前密码" autocomplete="current-password">
                                    <div class="hu-field__err"></div>
                                </div>
                                <div class="hu-field"></div>
                                <div class="hu-field">
                                    <label for="newPassword">新密码</label>
                                    <input type="password" id="newPassword" class="hu-input" placeholder="8-32 位，含字母与数字" autocomplete="new-password">
                                    <div class="hu-field__err"></div>
                                </div>
                                <div class="hu-field">
                                    <label for="confirmPassword">确认新密码</label>
                                    <input type="password" id="confirmPassword" class="hu-input" placeholder="再次输入新密码" autocomplete="new-password">
                                    <div class="hu-field__err"></div>
                                </div>
                            </div>
                            <div class="hu-form-actions">
                                <button type="submit" class="hu-btn hu-btn--ghost" id="btnSavePwd"><i class="fa fa-lock"></i>修改密码</button>
                            </div>
                        </form>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{common/footer :: footer}"></div>

<script>
    var PROFILE_API = '/auth/api/user/profile';
    var PASSWORD_API = '/auth/api/user/password';
    var memberLevels = {'ordinary': '普通会员', 'vip': 'VIP 会员'};
    var statusMap = {'active': ['正常', 'var(--hu-accent-deep)'], 'inactive': ['已禁用', 'var(--hu-clay)'], 'locked': ['已锁定', 'var(--hu-clay)']};

    function fmtTime(value) {
        return value ? new Date(value).toLocaleString('zh-CN', {hour12: false}) : '暂未记录';
    }

    function today() {
        var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    /** 字段级错误提示：与服务端 @Valid 规则保持一致，避免无效请求 */
    function setErr($field, message) {
        $field.closest('.hu-field').toggleClass('has-err', !!message);
        $field.closest('.hu-field').find('.hu-field__err').text(message || '');
        return !message;
    }

    function renderProfile(user) {
        $('#profileContent').show();
        $('#username').val(user.username || '');
        $('#fullName').val(user.fullName || '');
        $('#phone').val(user.phone || '');
        $('#email').val(user.email || '');
        $('#gender').val(user.gender || '');
        $('#birthday').val(user.birthday || '').attr('max', today());

        $('#memberLevel').text(memberLevels[user.memberLevel] || user.memberLevel || '普通会员');
        $('#points').text(user.points || 0);
        $('#pointsHero').text(user.points || 0);
        var st = statusMap[user.status] || [user.status || '-', 'var(--hu-ink)'];
        $('#status').text(st[0]).css('color', st[1]);
        $('#pointsHint').text('积分规则：消费 1 元累计 1 积分，100 积分可抵 1 元，单笔最多抵扣应付金额的 20%；VIP 会员全场 95 折。');

        var vip = user.memberLevel === 'vip';
        $('#metaType').text(memberLevels[user.memberLevel] || '普通会员')
            .attr('class', 'hu-pill ' + (vip ? 'hu-pill--ok' : 'hu-pill--muted'));
        $('#metaRole').text(user.userType === 'admin' ? '管理员' : '进店顾客');
        $('#metaCreated').text(fmtTime(user.createdAt));
        $('#metaLastLogin').text(fmtTime(user.lastLoginTime));
        $('#metaPwd').text(user.mustChangePassword ? '重置后的初始密码，需修改' : '可自行修改');
        $('#pwdTip').toggle(!!user.mustChangePassword);

        var name = user.fullName || user.username || '';
        $('#sideName').text(name || '用户');
        $('#sidePhone').text(user.phone || '');
        if (name) {
            $('#avatar').html($('<span>').text(name.charAt(0)));
        }
    }

    function validateProfile() {
        var ok = true;
        ok = setErr($('#fullName'), $.trim($('#fullName').val()) ? '' : '请填写真实姓名') && ok;
        var phone = $.trim($('#phone').val());
        ok = setErr($('#phone'), !phone ? '请填写手机号' : (/^1[3-9]\d{9}$/.test(phone) ? '' : '手机号格式不正确')) && ok;
        var email = $.trim($('#email').val());
        ok = setErr($('#email'), !email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '' : '邮箱格式不正确') && ok;
        var birthday = $('#birthday').val();
        ok = setErr($('#birthday'), !birthday || birthday <= today() ? '' : '生日不能晚于今天') && ok;
        return ok;
    }

    function validatePassword() {
        var pwd = $('#newPassword').val();
        var ok = true;
        ok = setErr($('#oldPassword'), $('#oldPassword').val() ? '' : '请输入原密码') && ok;
        ok = setErr($('#newPassword'), /^(?=.*[A-Za-z])(?=.*\d).{8,32}$/.test(pwd) ? '' : '新密码需为 8-32 位且同时包含字母和数字') && ok;
        ok = setErr($('#confirmPassword'), $('#confirmPassword').val() === pwd ? '' : '两次输入的密码不一致') && ok;
        return ok;
    }

    function loadProfile() {
        huApi({url: PROFILE_API, ok: renderProfile});
    }

    $('#profileForm').submit(function (e) {
        e.preventDefault();
        if (!validateProfile()) return;
        var $btn = $('#btnSaveProfile').prop('disabled', true);
        huApi({
            url: PROFILE_API,
            type: 'PUT',
            data: {
                fullName: $.trim($('#fullName').val()),
                phone: $.trim($('#phone').val()),
                email: $.trim($('#email').val()) || null,
                gender: $('#gender').val() || '',
                birthday: $('#birthday').val() || null
            },
            ok: function (user) {
                renderProfile(user);
                window.huToast('资料已保存', 'ok');
            },
            always: function () { $btn.prop('disabled', false); }
        });
    });

    $('#passwordForm').submit(function (e) {
        e.preventDefault();
        if (!validatePassword()) return;
        var $btn = $('#btnSavePwd').prop('disabled', true);
        huApi({
            url: PASSWORD_API,
            type: 'PUT',
            data: {oldPassword: $('#oldPassword').val(), newPassword: $('#newPassword').val()},
            ok: function () {
                window.huToast('密码已修改，请重新登录', 'ok');
                setTimeout(function () { window.location.href = '/auth/login?redirect=%2Fuser%2Fprofile'; }, 900);
            },
            fail: function () { $('#oldPassword').val('').focus(); },
            always: function () { $btn.prop('disabled', false); }
        });
    });

    $(document).ready(loadProfile);
</script>
</body>
</html>
